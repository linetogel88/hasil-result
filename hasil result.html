    function isGoogleWebApp(){
      return Boolean(window.google&&google.script&&google.script.run);
    }

    function serverCallThroughJsonpOnce(functionName,...args){
      return new Promise((resolve,reject)=>{
        const baseUrl=String(ARCHIVE_CONFIG.webAppUrl||'').trim();

        if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/i.test(baseUrl)){
          reject(new Error('Database Web App URL is invalid.'));
          return;
        }

        const callbackName=
          `dashboardApiCallback_${Date.now()}_${Math.random()
            .toString(36)
            .slice(2)}`;

        const script=document.createElement('script');
        let settled=false;
        let timer=null;

        const cleanup=()=>{
          if(timer)clearTimeout(timer);
          script.remove();

          try{
            delete window[callbackName];
          }catch{
            window[callbackName]=undefined;
          }
        };

        const finish=(handler,value)=>{
          if(settled)return;
          settled=true;
          cleanup();
          handler(value);
        };

        window[callbackName]=response=>{
          if(response&&response.ok===false){
            finish(
              reject,
              new Error(response.message||'Database returned an error.')
            );
            return;
          }

          finish(resolve,response);
        };

        const query=new URLSearchParams({
          api:'1',
          action:functionName,
          callback:callbackName,
          cacheBust:`${Date.now()}-${Math.random().toString(36).slice(2)}`
        });

        if(functionName==='getStoredSnapshot'){
          query.set('dateKey',String(args[0]||''));
        }else if(functionName==='getWallpaperDataUrl'){
          query.set('url',String(args[0]||''));
        }else{
          args.forEach((value,index)=>{
            query.set(`arg${index}`,String(value??''));
          });
        }

        script.src=`${baseUrl}?${query.toString()}`;
        script.async=true;
        script.referrerPolicy='no-referrer';

        script.onerror=()=>{
          finish(
            reject,
            new Error('Google Apps Script database API failed to load.')
          );
        };

        timer=setTimeout(()=>{
          finish(
            reject,
            new Error('Database API connection took too long.')
          );
        },ARCHIVE_CONFIG.serverTimeoutMs);

        document.head.appendChild(script);
      });
    }

    async function serverCallThroughJsonp(functionName,...args){
      let lastError=null;

      for(let attempt=1;attempt<=ARCHIVE_CONFIG.apiRetries;attempt++){
        try{
          return await serverCallThroughJsonpOnce(functionName,...args);
        }catch(error){
          lastError=error;

          if(attempt<ARCHIVE_CONFIG.apiRetries){
            await wait(
              ARCHIVE_CONFIG.apiRetryDelayMs*attempt
            );
          }
        }
      }

      throw lastError||new Error('Database API did not respond.');
    }

    function serverCallRaw(functionName,...args){
      if(!isGoogleWebApp()){
        return serverCallThroughJsonp(functionName,...args);
      }

      return new Promise((resolve,reject)=>{
        let settled=false;

        const timer=setTimeout(()=>{
          if(settled)return;
          settled=true;
          reject(new Error('Apps Script database connection took too long.'));
        },ARCHIVE_CONFIG.serverTimeoutMs);

        const finish=(handler,value)=>{
          if(settled)return;
          settled=true;
          clearTimeout(timer);
          handler(value);
        };

        const runner=google.script.run
          .withSuccessHandler(value=>finish(resolve,value))
          .withFailureHandler(error=>finish(
            reject,
            new Error(
              error?.message||
              String(error)||
              'A database error occurred.'
            )
          ));

        runner[functionName](...args);
      });
    }

    function serverCall(functionName,...args){
      const requestKey=
        `${functionName}:${JSON.stringify(args)}`;

      if(pendingServerCalls.has(requestKey)){
        return pendingServerCalls.get(requestKey);
      }

      const request=serverCallRaw(functionName,...args)
        .finally(()=>{
          if(pendingServerCalls.get(requestKey)===request){
            pendingServerCalls.delete(requestKey);
          }
        });

      pendingServerCalls.set(requestKey,request);
      return request;
    }

    function safeCssUrl(value=''){
      return String(value).replace(/["\\\n\r]/g,'');
    }

    function setDarkWallpaper(){
      document.body.style.setProperty('--wallpaper-image','none');
    }

    function setWallpaperImage(source){
      document.body.style.setProperty('--wallpaper-image', `url("${source}")`);
    }

    async function loadWallpaperThroughProxy(clean){
      if(!clean||wallpaperProxyRequestUrl===clean)return;
      wallpaperProxyRequestUrl=clean;

      try{
        const response=await serverCall('getWallpaperDataUrl',clean);
        if(appliedWallpaperUrl!==clean)return;
        if(!response?.ok||!response.dataUrl){
          throw new Error('Server did not return image data.');
        }

        const proxyImage=new Image();
        proxyImage.onload=()=>{
          if(appliedWallpaperUrl!==clean)return;
          setWallpaperImage(response.dataUrl);
        };
        proxyImage.onerror=()=>{
          if(appliedWallpaperUrl!==clean)return;
          setDarkWallpaper();
          showToast('Wallpaper failed to load.','error');
        };
        proxyImage.src=response.dataUrl;
      }catch(error){
        if(appliedWallpaperUrl!==clean)return;
        setDarkWallpaper();

        if(error?.silentServerError||error?.message==='SERVER_MODE_UNAVAILABLE'){
          console.info('Apps Script wallpaper proxy skipped in plain HTML mode.');
          return;
        }

        console.error('Wallpaper proxy failed:',error);
        showToast('Wallpaper failed to load.','error');
      }finally{
        if(wallpaperProxyRequestUrl===clean)wallpaperProxyRequestUrl='';
      }
    }

    function applyWallpaper(url=''){
      const clean=safeCssUrl(url);

      if(clean===appliedWallpaperUrl)return;
      appliedWallpaperUrl=clean;

      if(!clean){
        wallpaperProxyRequestUrl='';
        setDarkWallpaper();
        return;
      }

      const image=new Image();
      image.onload=()=>{
        if(appliedWallpaperUrl!==clean)return;
        setWallpaperImage(clean);
      };
      image.onerror=()=>{
        if(appliedWallpaperUrl!==clean)return;
        console.warn('Direct hotlink failed, trying Apps Script proxy:',clean);
        loadWallpaperThroughProxy(clean);
      };

      const separator=clean.includes('?')?'&':'?';
      image.src=`${clean}${separator}dashboard_refresh=${Date.now()}`;
    }

    function getWibTodayKey(){
      const parts=new Intl.DateTimeFormat('en-CA',{
        timeZone:ARCHIVE_CONFIG.timezone,
        year:'numeric',
        month:'2-digit',
        day:'2-digit'
      }).formatToParts(new Date());
      const map=Object.fromEntries(parts.map(part=>[part.type,part.value]));
      return `${map.year}-${map.month}-${map.day}`;
    }

    function shiftDateKey(dateKey,days){
      const [year,month,day]=dateKey.split('-').map(Number);
      const utcDate=new Date(Date.UTC(year,month-1,day));
      utcDate.setUTCDate(utcDate.getUTCDate()+days);
      return [
        utcDate.getUTCFullYear(),
        String(utcDate.getUTCMonth()+1).padStart(2,'0'),
        String(utcDate.getUTCDate()).padStart(2,'0')
      ].join('-');
    }

    function formatDateOption(dateKey){
      const [year,month,day]=dateKey.split('-').map(Number);
      const date=new Date(Date.UTC(year,month-1,day,12,0,0));
      const dayName=new Intl.DateTimeFormat('id-ID',{
        weekday:'long',
        timeZone:'UTC'
      }).format(date);
      const fullDate=new Intl.DateTimeFormat('id-ID',{
        day:'2-digit',
        month:'long',
        year:'numeric',
        timeZone:'UTC'
      }).format(date);
      return {dayName,fullDate};
    }

    function dashboardDateRange(){
      const today=dashboardMeta.today||getWibTodayKey();
      return {
        today,
        minDate:shiftDateKey(today,-13)
      };
    }

    function isDashboardDateSelectable(dateKey=''){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(dateKey))return false;
      const {today,minDate}=dashboardDateRange();
      return dateKey>=minDate&&dateKey<=today;
    }

    function calendarMonthKey(dateKey=''){
      const fallback=dashboardMeta.today||getWibTodayKey();
      const clean=/^\d{4}-\d{2}(?:-\d{2})?$/.test(dateKey)?dateKey:fallback;
      return clean.slice(0,7);
    }

    function shiftCalendarMonth(monthKey,offset){
      const [year,month]=calendarMonthKey(monthKey).split('-').map(Number);
      const date=new Date(Date.UTC(year,month-1+offset,1));
      return [
        date.getUTCFullYear(),
        String(date.getUTCMonth()+1).padStart(2,'0')
      ].join('-');
    }

    function calendarMonthBounds(monthKey){
      const normalized=calendarMonthKey(monthKey);
      const firstDate=`${normalized}-01`;
      const nextMonth=shiftCalendarMonth(normalized,1);
      return {
        firstDate,
        lastDate:shiftDateKey(`${nextMonth}-01`,-1)
      };
    }

    function calendarMonthHasSelectableDate(monthKey){
      const {today,minDate}=dashboardDateRange();
      const {firstDate,lastDate}=calendarMonthBounds(monthKey);
      return firstDate<=today&&lastDate>=minDate;
    }

    function clampCalendarViewMonth(monthKey){
      const normalized=calendarMonthKey(monthKey);
      if(calendarMonthHasSelectableDate(normalized))return normalized;

      const {today,minDate}=dashboardDateRange();
      const minMonth=calendarMonthKey(minDate);
      const maxMonth=calendarMonthKey(today);
      if(normalized<minMonth)return minMonth;
      return maxMonth;
    }

    function calendarMonthLabel(monthKey){
      const [year,month]=calendarMonthKey(monthKey).split('-').map(Number);
      return new Intl.DateTimeFormat('id-ID',{
        month:'long',
        year:'numeric',
        timeZone:'UTC'
      }).format(new Date(Date.UTC(year,month-1,1,12,0,0)));
    }

    function getCalendarCells(monthKey){
      const normalized=calendarMonthKey(monthKey);
      const firstDate=`${normalized}-01`;
      const [year,month]=normalized.split('-').map(Number);
      const leadingDays=new Date(Date.UTC(year,month-1,1)).getUTCDay();
      const gridStart=shiftDateKey(firstDate,-leadingDays);

      return Array.from({length:42},(_,index)=>{
        const dateKey=shiftDateKey(gridStart,index);
        return {
          dateKey,
          day:Number(dateKey.slice(8,10)),
          outsideMonth:calendarMonthKey(dateKey)!==normalized
        };
      });
    }

    function closeDateMenu(){
      els.datePicker.classList.remove('open');
      els.datePickerButton.setAttribute('aria-expanded','false');
    }

    function openDateMenu(){
      const selected=els.dateFilter.value||dashboardMeta.today||getWibTodayKey();
      calendarViewMonth=clampCalendarViewMonth(calendarMonthKey(selected));
      renderDateMenu();
      els.datePicker.classList.add('open');
      els.datePickerButton.setAttribute('aria-expanded','true');
    }

    function toggleDateMenu(){
      if(els.datePicker.classList.contains('open'))closeDateMenu();
      else openDateMenu();
    }

    function renderDateMenu(){
      const selected=els.dateFilter.value||dashboardMeta.today||getWibTodayKey();
      const {today,minDate}=dashboardDateRange();
      const available=new Set(dashboardMeta.availableDates||[]);
      const weekdays=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];

      calendarViewMonth=clampCalendarViewMonth(
        calendarViewMonth||calendarMonthKey(selected)
      );

      const previousMonth=shiftCalendarMonth(calendarViewMonth,-1);
      const nextMonth=shiftCalendarMonth(calendarViewMonth,1);
      const canPrevious=calendarMonthHasSelectableDate(previousMonth);
      const canNext=calendarMonthHasSelectableDate(nextMonth);

      const dayButtons=getCalendarCells(calendarViewMonth).map(cell=>{
        const selectable=isDashboardDateSelectable(cell.dateKey);
        const isToday=cell.dateKey===today;
        const isActive=cell.dateKey===selected;
        const hasArchive=available.has(cell.dateKey);
        const info=formatDateOption(cell.dateKey);
        const disabledReason=cell.dateKey<minDate
          ? 'Tanggal lebih dari 14 hari yang lalu'
          : (cell.dateKey>today?'Tanggal mendatang belum dapat dipilih':'');

        return `
          <button
            class="calendar-day ${cell.outsideMonth?'outside-month':''} ${isToday?'today':''} ${isActive?'active':''}"
            type="button"
            role="gridcell"
            data-date-value="${cell.dateKey}"

        </div>`;

    function showNoResultForDate(dateKey){
      const info=formatDateOption(dateKey);

      currentDataMode='snapshot-empty';
      currentSnapshotDate=dateKey;
      allResults=[];
      lastDataSignature='';
      confirmedEmptyCycles=0;

      updateCounts();
      showState(
        'Belum ada hasil result di tanggal ini',
        `${info.dayName}, ${info.fullDate}`
      );
    }

    function showHistoryPending(dateKey){
      const info=formatDateOption(dateKey);

      currentDataMode='snapshot-pending';
      currentSnapshotDate=dateKey;
      allResults=[];
      lastDataSignature='';
      confirmedEmptyCycles=0;

      updateCounts();
      showState(
        'Menyiapkan history hasil',
        `${info.dayName}, ${info.fullDate}`
      );
    }

    function applyStoredSnapshotResponse(
      response,
      dateKey,
      {fromCache=false}={}
    ){
      if(
        !response?.found ||
        normalizeSnapshotDateKey(response.dateKey)!==dateKey
      ){
        return false;
      }

      const parsed=parseStoredCells(response.cells||[]);

      if(!parsed.length){
        return false;
      }

      currentDataMode=fromCache?'snapshot-cache':'snapshot';
      currentSnapshotDate=dateKey;
      allResults=parsed;
      lastDataSignature=dataSignature(parsed);
      confirmedEmptyCycles=0;

      applyWallpaper(
        response.wallpaper||
        dashboardMeta.wallpaper||
        ''
      );

      updateLastUpdateText(new Date());
      renderResults();

      if(!fromCache){
        saveSnapshotCache(response);
      }

      return true;
    }

    function showNoResultToday(){
      currentDataMode='live';
      currentSnapshotDate='';
      allResults=[];
      lastDataSignature='';
      confirmedEmptyCycles=0;

      updateCounts();
      showState(
        'Belum ada hasil result hari ini',
        'Hasil akan tampil otomatis setelah data prize sudah lengkap.'
      );
    }

    function resetDateSelectionToToday(){
      const today=dashboardMeta.today||getWibTodayKey();

      dateSelectionVersion+=1;
      els.dateFilter.value=today;
      els.dateDisplay.textContent=prettyDate(today);
      calendarViewMonth=calendarMonthKey(today);
      currentDataMode='live';
      currentSnapshotDate='';
      closeDateMenu();
      renderDateMenu();

      return today;
    }

    async function selectDashboardDate(value,{silent=false}={}){
      if(!value)return;

      if(!isDashboardDateSelectable(value)){
        showToast('Tanggal hanya dapat dipilih untuk 14 hari terakhir.','error');
        calendarViewMonth=clampCalendarViewMonth(calendarMonthKey(value));
        renderDateMenu();
        return false;
      }

      const selectionVersion=++dateSelectionVersion;
      liveRequestVersion+=1;
      snapshotRequestVersion+=1;
      clearTimeout(historyRetryTimer);

      const today=dashboardMeta.today||getWibTodayKey();
      const isToday=value===today;
      const selectedInfo=formatDateOption(value);

      showLoadingEffect('date',{
        title:isToday?'MENAMPILKAN HARI INI':'MEMBUKA ARSIP HASIL',
        subtitle:`${selectedInfo.dayName}, ${selectedInfo.fullDate}`
      });

      els.dateFilter.value=value;
      els.dateDisplay.textContent=prettyDate(value);
      calendarViewMonth=calendarMonthKey(value);
      closeDateMenu();
      renderDateMenu();

      if(isToday){
        showNoResultToday();
        applyWallpaper(dashboardMeta.wallpaper||'');
      }else{
        const cached=readSnapshotCache(value);

        if(!cached||!applyStoredSnapshotResponse(
          cached,
          value,
          {fromCache:true}
        )){
          showHistoryPending(value);
        }
      }

      if(isToday){
        if(dashboardMeta.todayLocked&&dashboardMeta.today){
          await loadStoredSnapshot(today,{silent,selectionVersion});
        }else{
          currentDataMode='live';
          currentSnapshotDate='';
          await loadSheetData({silent:true});
        }
        return true;
      }

      await loadStoredSnapshot(value,{silent,selectionVersion});
      return true;
    }

    function selectedDateKey(){
      return els.dateFilter.value||dashboardMeta.today||'';
    }

    function isViewingToday(){
      const selected=els.dateFilter.value;
      return !selected||!dashboardMeta.today||selected===dashboardMeta.today;
    }

    function updateDateLimits(meta={}){
      const today=meta.today||getWibTodayKey();
      els.dateFilter.max=today;
      els.dateFilter.min=shiftDateKey(today,-13);

      if(
        els.dateFilter.value&&
        !isDashboardDateSelectable(els.dateFilter.value)
      ){
        els.dateFilter.value=today;
        els.dateDisplay.textContent=prettyDate(today);
      }

      calendarViewMonth=clampCalendarViewMonth(
        calendarMonthKey(els.dateFilter.value||today)
      );
      renderDateMenu();
    }

    async function loadStoredSnapshot(
      dateKey,
      {silent=true,selectionVersion=null}={}
    ){
      if(!dateKey)return false;

      const requestVersion=++snapshotRequestVersion;
      const cached=readSnapshotCache(dateKey);

      try{
        const response=await serverCall('getStoredSnapshot',dateKey);

        if(
          selectedDateKey()!==dateKey ||
          requestVersion!==snapshotRequestVersion ||
          (
            selectionVersion!==null &&
            selectionVersion!==dateSelectionVersion
          )
        ){
          return false;
        }

        if(response?.found){
          if(applyStoredSnapshotResponse(response,dateKey)){
            return true;
          }

          if(cached&&applyStoredSnapshotResponse(
            cached,
            dateKey,
            {fromCache:true}
          )){
            return true;
          }

          showNoResultForDate(dateKey);
          return true;
        }

        if(cached&&applyStoredSnapshotResponse(
          cached,
          dateKey,
          {fromCache:true}
        )){
          return true;
        }

        showNoResultForDate(dateKey);
        return false;
      }catch(error){
        if(
          selectedDateKey()!==dateKey ||
          requestVersion!==snapshotRequestVersion
        ){
          return false;
        }

        console.error('Failed reading archive database:',error);

        if(
          currentSnapshotDate===dateKey &&
          allResults.length
        ){
          if(!silent){
            showToast(
              'Koneksi history terputus sesaat. Data terakhir tetap ditampilkan.',
              'error'
            );
          }
          return true;
        }

        if(cached&&applyStoredSnapshotResponse(
          cached,
          dateKey,
          {fromCache:true}
        )){
          if(!silent){
            showToast(
              'History ditampilkan dari cadangan browser.',
              'error'
            );
          }
          return true;
        }

        showHistoryPending(dateKey);

        clearTimeout(historyRetryTimer);
        historyRetryTimer=setTimeout(()=>{
          if(selectedDateKey()===dateKey){
            loadStoredSnapshot(
              dateKey,
              {
                silent:true,
                selectionVersion:dateSelectionVersion
              }
            );
          }
        },2500);

        if(!silent){
          showToast(
            'History sedang dicoba kembali.',
            'error'
          );
        }

        return false;
      }
    }

    async function loadDashboardMeta({silent=true}={}){
      try{
        const meta=await serverCall('getDashboardMeta');
        if(!meta?.ok)throw new Error(meta?.message||'Dashboard metadata is invalid.');

        saveMetaCache(meta);

        dashboardMeta={
          today:meta.today||'',
          todayLocked:Boolean(meta.todayLocked),
          availableDates:Array.isArray(meta.availableDates)?meta.availableDates:[],
          oldestDate:meta.oldestDate||'',
          wallpaper:meta.wallpaper||'',
          wallpaperSource:meta.wallpaperSource||''
        };

        updateDateLimits(dashboardMeta);

        if(!els.dateFilter.value&&dashboardMeta.today){
          els.dateFilter.value=dashboardMeta.today;
          els.dateDisplay.textContent=prettyDate(dashboardMeta.today);
        }
        renderDateMenu();

        const selected=els.dateFilter.value;

        if(!selected||!dashboardMeta.today||selected===dashboardMeta.today){
          applyWallpaper(dashboardMeta.wallpaper);
        }

        if(selected&&dashboardMeta.today&&selected!==dashboardMeta.today){
          if(
            !String(currentDataMode).startsWith('snapshot') ||
            currentSnapshotDate!==selected
          ){
            await loadStoredSnapshot(selected,{silent});
          }
          return;
        }

        if(dashboardMeta.todayLocked&&dashboardMeta.today){
          if(currentDataMode!=='snapshot'||currentSnapshotDate!==dashboardMeta.today){
            await loadStoredSnapshot(dashboardMeta.today,{silent});
          }
          return;
        }

        if(currentDataMode!=='live'){
          currentDataMode='live';
          currentSnapshotDate='';
          await loadSheetData({silent:true});
        }
      }catch(error){
        console.error('Failed reading dashboard metadata:',error);

        if(!dashboardMeta.today){
          const cachedMeta=readMetaCache();

          if(cachedMeta?.today){
            dashboardMeta={
              today:cachedMeta.today||'',
              todayLocked:Boolean(cachedMeta.todayLocked),
              availableDates:Array.isArray(cachedMeta.availableDates)
                ? cachedMeta.availableDates
                : [],
              oldestDate:cachedMeta.oldestDate||'',
              wallpaper:cachedMeta.wallpaper||'',
              wallpaperSource:cachedMeta.wallpaperSource||''
            };

            updateDateLimits(dashboardMeta);
            renderDateMenu();
          }
        }
      }
    }

    function formatWib(date=new Date()){
      try{
        return new Intl.DateTimeFormat('id-ID',{
          timeZone:'Asia/Jakarta',
          day:'2-digit',month:'2-digit',year:'numeric',
          hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false
        }).format(date).replace(/\./g,':')+' WIB';
      }catch{return date.toLocaleString('id-ID');}
    }

    function updateLastUpdateText(date=new Date()){
      if(els.lastUpdate)els.lastUpdate.textContent=formatWib(date);
    }

    function prettyDate(value){
      if(!value)return 'Pilih tanggal';
      const [year,month,day]=value.split('-');
      const names=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
      return `${day}-${names[Number(month)-1]}-${year}`;
    }

      els.normalCount.textContent=normal;
      els.hokiCount.textContent=hoki;
      els.normalTabCount.textContent=normal;
      els.hokiTabCount.textContent=hoki;

        item.localizedLines||
        item.lines.map(localizeDateLanguage);

      const cardTextHtml=displayLines
        .map(line=>{
          const clean=String(line??'');
          const isResult=/^\s*Result(?:\s*\d+)?\s*:/i.test(clean);
          return `<span class="card-line ${isResult?'result-line':''}">${escapeHtml(clean)}</span>`;
        })

    function filteredResults(){
      const keyword=normalizeForSearch(els.search.value).toLowerCase();
      const selectedDate=els.dateFilter.value;
      let rows=allResults.filter(item=>activeTab==='hoki'?item.isHoki:!item.isHoki);
      if(keyword)rows=rows.filter(item=>item.searchText.includes(keyword));
      if(selectedDate)rows=rows.filter(item=>item.dateTokens.includes(selectedDate));
      if(activeSort==='newest'){
        rows.sort((a,b)=>b.index-a.index);
      }else{
        rows.sort((a,b)=>a.index-b.index);
      }
      return rows;
    }

    function gridMotionAllowed(){
      return !(
        typeof window.matchMedia==='function' &&
        window.matchMedia('(prefers-reduced-motion: reduce)').matches
      );
    }

    function playGridMotion(element,keyframes,options){
      if(!gridMotionAllowed()||typeof element.animate!=='function')return null;
      const animation=element.animate(keyframes,{
        fill:'both',
        ...options
      });
      animation.finished.catch(()=>{});
      return animation;
    }

    function cardRenderSignature(item){
      return JSON.stringify([
        item.market,
        Boolean(item.isMulti),
        item.localizedLines||item.lines.map(localizeDateLanguage)
      ]);
    }

    function createCardNode(item){
      const template=document.createElement('template');
      template.innerHTML=cardTemplate(item).trim();
      const card=template.content.firstElementChild;
      card.dataset.cardId=item.id;
      card.dataset.cardSignature=cardRenderSignature(item);
      return card;
    }

    function syncCardNode(card,item){
      const nextSignature=cardRenderSignature(item);
      if(card.dataset.cardSignature===nextSignature)return false;

      const copyButton=card.querySelector('.copy-btn');
      const hadCopyFocus=Boolean(copyButton&&copyButton===document.activeElement);
      const wasCopying=copyButton?.dataset.copying==='true';
      const freshCard=createCardNode(item);

      card.className=freshCard.className;
      card.replaceChildren(...freshCard.childNodes);
      card.dataset.cardId=item.id;
      card.dataset.cardSignature=nextSignature;

      const nextCopyButton=card.querySelector('.copy-btn');
      if(wasCopying&&nextCopyButton)nextCopyButton.dataset.copying='true';
      if(hadCopyFocus&&nextCopyButton){
        requestAnimationFrame(()=>{
          try{nextCopyButton.focus({preventScroll:true});}
          catch{nextCopyButton.focus();}
        });
      }

      return true;
    }

    function animateRemovedCard(card,rect){
      if(!gridMotionAllowed()||rect.width<1||rect.height<1)return;

      const ghost=card.cloneNode(true);
      ghost.dataset.gridGhost='true';
      ghost.setAttribute('aria-hidden','true');
      Object.assign(ghost.style,{
        position:'fixed',
        left:`${rect.left}px`,
        top:`${rect.top}px`,
        width:`${rect.width}px`,
        height:`${rect.height}px`,
        minHeight:'0',
        zIndex:'450',
        pointerEvents:'none'
      });
      document.body.appendChild(ghost);

      const animation=playGridMotion(
        ghost,
        [
          {opacity:1,transform:'translate3d(0,0,0) scale(1)'},
          {opacity:0,transform:'translate3d(0,8px,0) scale(.975)'}
        ],
        {duration:GRID_MOTION.exitMs,easing:'ease-out'}
      );

      if(animation){
        animation.finished.finally(()=>ghost.remove());
      }else{
        ghost.remove();
      }
    }

    function reconcileResultCards(rows,{fresh=false}={}){
      document
        .querySelectorAll('[data-grid-ghost="true"]')
        .forEach(ghost=>ghost.remove());

      const oldCards=[...els.grid.children]
        .filter(card=>card.matches('.card[data-card-id]'));

      oldCards.forEach(card=>{
        if(typeof card.getAnimations==='function'){
          card.getAnimations().forEach(animation=>animation.cancel());
        }
      });

      const oldRects=new Map(
        oldCards.map(card=>[card.dataset.cardId,card.getBoundingClientRect()])
      );
      const existingCards=new Map(
        oldCards.map(card=>[card.dataset.cardId,card])
      );
      const nextIds=new Set(rows.map(item=>item.id));
      const sharedCount=rows.reduce(
        (count,item)=>count+(existingCards.has(item.id)?1:0),
        0
      );
      const removedCards=sharedCount>0
        ? oldCards
            .filter(card=>!nextIds.has(card.dataset.cardId))
            .map(card=>({
              card:card.cloneNode(true),
              rect:oldRects.get(card.dataset.cardId)
            }))
        : [];

      const fragment=document.createDocumentFragment();
      const newCards=[];
      const updatedCards=[];
      const reusedCards=[];

      rows.forEach(item=>{
        let card=existingCards.get(item.id);

        if(card){
          reusedCards.push(card);
          if(syncCardNode(card,item))updatedCards.push(card);
        }else{
          card=createCardNode(item);
          newCards.push(card);
        }

        fragment.appendChild(card);
      });

      els.grid.replaceChildren(fragment);
      els.state.classList.add('hidden');
      els.grid.classList.remove('hidden');

      removedCards.forEach(({card,rect})=>animateRemovedCard(card,rect));

      reusedCards.forEach(card=>{
        const first=oldRects.get(card.dataset.cardId);
        const last=card.getBoundingClientRect();
        if(!first||first.width<1||last.width<1)return;

        const deltaX=first.left-last.left;
        const deltaY=first.top-last.top;
        if(Math.abs(deltaX)<.5&&Math.abs(deltaY)<.5)return;

        playGridMotion(
          card,
          [
            {transform:`translate3d(${deltaX}px,${deltaY}px,0)`},
            {transform:'translate3d(0,0,0)'}
          ],
          {duration:GRID_MOTION.moveMs,easing:GRID_MOTION.easing}
        );
      });

      newCards.forEach((card,index)=>{
        playGridMotion(
          card,
          [
            {opacity:0,transform:'translate3d(0,10px,0) scale(.985)'},
            {opacity:1,transform:'translate3d(0,0,0) scale(1)'}
          ],
          {
            duration:GRID_MOTION.enterMs,
            delay:Math.min(index*18,108),
            easing:GRID_MOTION.easing
          }
        );
      });

      if(fresh){
        updatedCards.forEach(card=>{
          playGridMotion(
            card,
            [{opacity:.86},{opacity:1}],
            {duration:260,easing:'ease-out'}
          );
        });
      }
    }

    function renderResults({fresh=false}={}){
      updateCounts();
      if(!allResults.length){
        showState('Belum ada data lengkap','Pasaran baru tampil setelah seluruh Result wajibnya terisi. Nilai 0000 tetap dianggap sebagai data lengkap.');
        return;
      }
      const rows=filteredResults();
      if(!rows.length){
        showState('Data tidak ditemukan','Tidak ada data terisi pada pilihan pasaran, tanggal, atau pencarian tersebut.');
        return;
      }
      reconcileResultCards(rows,{fresh});

      if(copiedMarketId&&Date.now()<copiedUntil){
        applyCopyVisual(copiedMarketId);
      }else if(copiedMarketId){
        copiedMarketId='';
        copiedUntil=0;
        resetAllCopyVisuals();
      }
    }

    function dataSignature(rows){
      return JSON.stringify(rows.map(item=>item.lines));
    }

    function applySheetResults(parsed,{silent=false}={}){
      const trackedResults=applyMarketActivity(parsed);
      const nextSignature=dataSignature(trackedResults);
      const changed=nextSignature!==lastDataSignature;
      confirmedEmptyCycles=0;
      if(changed){
        allResults=trackedResults;
        lastDataSignature=nextSignature;
        updateLastUpdateText(new Date());
        renderResults({fresh:true});
      }else if(!allResults.length){
        allResults=trackedResults;
        updateLastUpdateText(new Date());
        renderResults();
      }
    }

    async function loadSheetData({silent=false}={}){
      if(isLoading)return;

      if(!isViewingToday())return;
      if(dashboardMeta.todayLocked&&dashboardMeta.today){
        await loadStoredSnapshot(dashboardMeta.today,{silent:true});
        return;
      }

      const requestVersion=++liveRequestVersion;
      const selectionVersion=dateSelectionVersion;

      currentDataMode='live';
      currentSnapshotDate='';
      isLoading=true;

      const attempts=[
        {gid:CONFIG.gid,range:CONFIG.range},
        {sheet:CONFIG.sheetName,range:CONFIG.range}
      ];
      let lastError=null;
      let emptyCandidate=null;

      try{
        for(const attempt of attempts){
          try{
            const parsed=parseResponse(await requestGoogleSheet(attempt));

            if(
              requestVersion!==liveRequestVersion ||
              selectionVersion!==dateSelectionVersion ||
              !isViewingToday() ||
              dashboardMeta.todayLocked
            ){
              return;
            }

            if(parsed.length){
              applySheetResults(parsed,{silent});
              return;
            }
            emptyCandidate=parsed;
            if(!allResults.length){
              if(
                requestVersion===liveRequestVersion &&
                selectionVersion===dateSelectionVersion &&
                isViewingToday() &&
                !dashboardMeta.todayLocked
              ){
                applySheetResults(parsed,{silent});
              }
              return;
            }
          }catch(error){
            lastError=error;
            console.warn('Google Sheets path failed:',error);
          }
        }

        if(emptyCandidate&&allResults.length){
          confirmedEmptyCycles+=1;
          if(confirmedEmptyCycles>=2&&dashboardMeta.today){
            const restored=await loadStoredSnapshot(dashboardMeta.today,{silent:true});
            if(!restored){
              allResults=[];
              lastDataSignature='[]';
              renderResults({fresh:true});
            }
          }
          return;
        }

        throw lastError||new Error('Google Sheets did not provide a response.');
      }catch(error){
        console.error(error);

        if(
          requestVersion===liveRequestVersion &&
          selectionVersion===dateSelectionVersion &&
          isViewingToday()
        ){
          if(!allResults.length){
            showState(
              'Google Sheets tidak dapat diakses',
              'Pastikan akses Google Sheet adalah: Siapa saja yang memiliki link dapat melihat.'
            );
          }

          if(!silent){
            showToast(
              error?.message||'Koneksi Google Sheets gagal.',
              'error'
            );
          }
        }
      }finally{
        isLoading=false;
      }
    }

    async function refreshDashboardManually(){
      if(manualRefreshRunning)return;

      manualRefreshRunning=true;
      els.refreshBtn.disabled=true;
      els.refreshBtn.classList.add('loading');

      showLoadingEffect('refresh',{
        title:'MEMINDAI DATA TERBARU',
        subtitle:isViewingToday()
          ? 'Menyinkronkan hasil live dan pengaturan dashboard'
          : `Memperbarui arsip ${prettyDate(selectedDateKey())}`
      });

      try{
        const dataRequest=isViewingToday()
          ? loadSheetData({silent:true})
          : loadStoredSnapshot(selectedDateKey(),{silent:true});

        await Promise.allSettled([
          dataRequest,
          loadDashboardMeta({silent:true}),
          loadWallpaperDirectFromSheet()
        ]);

        updateLastUpdateText(new Date());
        showToast('Dashboard berhasil diperbarui.');
      }finally{
        manualRefreshRunning=false;
        els.refreshBtn.disabled=false;
        els.refreshBtn.classList.remove('loading');
      }
    }

    async function copyText(text){
      try{
        if(navigator.clipboard&&window.isSecureContext){
          await navigator.clipboard.writeText(text);
          return true;
        }

        const area=document.createElement('textarea');
        area.value=text;
        area.setAttribute('readonly','');
        area.style.position='fixed';
        area.style.left='-9999px';
        area.style.opacity='0';
        document.body.appendChild(area);
        area.select();
        area.setSelectionRange(0,area.value.length);
        const success=document.execCommand('copy');
        area.remove();

        if(!success)throw new Error('Copy command was rejected by the browser.');
        return true;
      }catch(error){
        console.error('Failed to copy:',error);
        return false;
      }
    }

    function resetAllCopyVisuals(){
      els.grid.querySelectorAll('.copy-btn').forEach(copyButton=>{
        copyButton.classList.remove('copied');
        copyButton.disabled=false;
        delete copyButton.dataset.copying;

        const label=copyButton.querySelector('.copy-label');
        const icon=copyButton.querySelector('.copy-icon');
        const card=copyButton.closest('.card');

        if(card)card.classList.remove('copy-success');
        if(label)label.textContent='SALIN';
        if(icon){
          icon.innerHTML='<rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>';
        }
      });
    }

    function findCopyButtonById(itemId){
      return [...els.grid.querySelectorAll('[data-copy-id]')]
        .find(copyButton=>copyButton.dataset.copyId===itemId)||null;
    }

    function applyCopyVisual(itemId){
      const currentButton=findCopyButtonById(itemId);
      if(!currentButton)return;

      const card=currentButton.closest('.card');
      const label=currentButton.querySelector('.copy-label');
      const icon=currentButton.querySelector('.copy-icon');

      currentButton.classList.add('copied');
      if(card)card.classList.add('copy-success');
      if(label)label.textContent='TERSALIN';
      if(icon)icon.innerHTML='<path d="m5 12 4 4L19 6"></path>';
    }

    function showCopySuccess(button,item){
      clearTimeout(copiedResetTimer);

      resetAllCopyVisuals();

      copiedEffectVersion+=1;
      const effectVersion=copiedEffectVersion;

      copiedMarketId=item.id;
      copiedUntil=Date.now()+1500;

      applyCopyVisual(item.id);

      copiedResetTimer=setTimeout(()=>{
        if(effectVersion!==copiedEffectVersion)return;

        copiedMarketId='';
        copiedUntil=0;
        resetAllCopyVisuals();
      },1500);
    }

    els.grid.addEventListener('click',async event=>{
      const button=event.target.closest('[data-copy-id]');
      if(!button||button.dataset.copying==='true')return;

      const item=allResults.find(row=>row.id===button.dataset.copyId);
      if(!item)return;

      button.dataset.copying='true';

      const copiedLines=item.localizedLines||item.lines.map(localizeDateLanguage);
      const success=await copyText(copiedLines.join('\n'));

      delete button.dataset.copying;
      const latestButton=findCopyButtonById(item.id);
      if(latestButton)delete latestButton.dataset.copying;

      if(success){
        showCopySuccess(latestButton||button,item);
      }else{
        resetAllCopyVisuals();
        showToast('Data gagal disalin. Izinkan akses clipboard browser.','error');
      }
    });

    els.tabs.forEach(tab=>tab.addEventListener('click',()=>{
      activeTab=tab.dataset.tab;
      els.tabs.forEach(item=>item.classList.toggle('active',item===tab));
      renderResults();
    }));

    els.search.addEventListener('input',renderResults);

    els.datePickerButton.addEventListener('click',event=>{
      event.preventDefault();
      event.stopPropagation();
      toggleDateMenu();
    });

    els.dateMenu.addEventListener('click',async event=>{
      const navigation=event.target.closest('[data-calendar-nav]');
      if(navigation){
        if(navigation.disabled)return;
        const nextMonth=shiftCalendarMonth(
          calendarViewMonth,
          Number(navigation.dataset.calendarNav)||0
        );
        if(calendarMonthHasSelectableDate(nextMonth)){
          calendarViewMonth=nextMonth;
          renderDateMenu();
        }
        return;
      }

      const calendarToday=event.target.closest('[data-calendar-today]');
      if(calendarToday){
        const today=dashboardMeta.today||getWibTodayKey();
        await selectDashboardDate(today,{silent:false});
        return;
      }

      const option=event.target.closest('[data-date-value]');
      if(!option||option.disabled)return;
      await selectDashboardDate(option.dataset.dateValue,{silent:false});
    });

    document.addEventListener('click',event=>{
      if(!els.datePicker.contains(event.target))closeDateMenu();
    });

    document.addEventListener('keydown',event=>{
      if(event.key==='Escape')closeDateMenu();
    });

    els.todayBtn.addEventListener('click',async()=>{
      const today=dashboardMeta.today||getWibTodayKey();
      await selectDashboardDate(today,{silent:false});
    });
    els.refreshBtn.addEventListener('click',refreshDashboardManually);
    els.newest.addEventListener('click',()=>{
      activeSort='newest';
      els.newest.classList.add('active');
      els.oldest.classList.remove('active');
      els.newest.textContent='Terbaru';
      renderResults();
    });
    els.oldest.addEventListener('click',()=>{
      activeSort='oldest';
      els.oldest.classList.add('active');
      els.newest.classList.remove('active');
      els.oldest.textContent='Terlama';
      renderResults();
    });

    document.addEventListener('visibilitychange',()=>{
      if(document.hidden)return;
      loadDashboardMeta({silent:true});
      loadWallpaperDirectFromSheet();
      if(isViewingToday()&&!dashboardMeta.todayLocked){
        loadSheetData({silent:true});
      }
    });

    resetDateSelectionToToday();

    showLoadingEffect('refresh',{
      eyebrow:'INISIALISASI DASHBOARD',
      title:'MENYIAPKAN HASIL RESULT',
      subtitle:''
    });

    loadSheetData();
    loadDashboardMeta({silent:true});
    loadWallpaperDirectFromSheet();

    wallpaperPollTimer=setInterval(()=>{
      if(!document.hidden)loadWallpaperDirectFromSheet();
    },5000);

    archiveMetaTimer=setInterval(()=>{
      if(!document.hidden)loadDashboardMeta({silent:true});
    },ARCHIVE_CONFIG.metaRefreshMs);

    refreshTimer=setInterval(()=>{
      if(!document.hidden&&isViewingToday()&&!dashboardMeta.todayLocked){
        loadSheetData({silent:true});
      }
    },CONFIG.refreshMs);
  </script>

  <script>
    /**
    * Keyboard shortcut guard.
    * Kept from the original code base to preserve behavior.
    */
    const shortcut = {
      all_shortcuts: {},
      add: function(combo, callback, options) {
        const defaultOpts = {
          type: "keydown",
          propagate: false,
          disable_in_input: false,
          target: document,
          keycode: false
        };
        const settings = Object.assign({}, defaultOpts, options || {});
        const target = typeof settings.target === "string"
          ? document.getElementById(settings.target)
          : settings.target;

        combo = combo.toLowerCase();

        const handler = function(e) {
          e = e || window.event;

          if (settings.disable_in_input) {
            let element = e.target || e.srcElement;
            if (element.nodeType === 3) element = element.parentNode;
            if (element.tagName === "INPUT" || element.tagName === "TEXTAREA") return;
          }

          const code = e.keyCode || e.which;
          let key = String.fromCharCode(code).toLowerCase();
          if (code === 188) key = ",";
          if (code === 190) key = ".";

          const keys = combo.split("+");
          let matchCount = 0;

          const specialKeys = {
            esc:27, escape:27, tab:9, space:32, return:13, enter:13,
            backspace:8, left:37, up:38, right:39, down:40,
            f1:112,f2:113,f3:114,f4:115,f5:116,f6:117,
            f7:118,f8:119,f9:120,f10:121,f11:122,f12:123
          };

          let ctrlReq=false, shiftReq=false, altReq=false, metaReq=false;
          let ctrl=e.ctrlKey, shift=e.shiftKey, alt=e.altKey, meta=e.metaKey;

          for (let i=0; i<keys.length; i++) {
            const k = keys[i];
            if (k === "ctrl" || k === "control") { ctrlReq = true; matchCount++; }
            else if (k === "shift") { shiftReq = true; matchCount++; }
            else if (k === "alt") { altReq = true; matchCount++; }
            else if (k === "meta") { metaReq = true; matchCount++; }
            else if (k.length > 1) { if (specialKeys[k] === code) matchCount++; }
            else if (settings.keycode ? settings.keycode === code : key === k) { matchCount++; }
          }

          if (
            matchCount === keys.length &&
            ctrl === ctrlReq && shift === shiftReq &&
            alt === altReq && meta === metaReq
          ) {
            callback(e);
            if (!settings.propagate) {
              e.cancelBubble = true;
              e.returnValue = false;
              if (e.stopPropagation) e.stopPropagation();
              if (e.preventDefault) e.preventDefault();
              return false;
            }
          }
        };

        this.all_shortcuts[combo] = { callback: handler, target, event: settings.type };
        target.addEventListener(settings.type, handler, false);
      }
    };

    function doNothing(e) {
      console.log("Shortcut blocked: " + (e.key || e.keyCode));
    }

    function setupShortcuts() {
      shortcut.add("Ctrl+U", doNothing);
      shortcut.add("f12", doNothing);
      shortcut.add("Ctrl+Shift+I", doNothing);
      shortcut.add("Ctrl+Shift+J", doNothing);
      shortcut.add("Ctrl+Shift+C", doNothing);
    }

    setupShortcuts();

    document.addEventListener('keydown', function(e) {
      if (e.keyCode === 123) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }

      if (e.ctrlKey && e.shiftKey && e.keyCode === 73) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }

      if (e.ctrlKey && e.shiftKey && e.keyCode === 74) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }

      if (e.ctrlKey && e.shiftKey && e.keyCode === 67) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }

      if (e.ctrlKey && e.keyCode === 85) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }

      if (e.ctrlKey && e.keyCode === 83) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }
    });

    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      return false;
    });

    document.addEventListener('dragstart', function(e) {
      e.preventDefault();
      return false;
    });

    document.addEventListener('selectstart', function(e) {
      if (e.target.closest('input, textarea, select')) return;
      e.preventDefault();
      return false;
    });
  </script>
