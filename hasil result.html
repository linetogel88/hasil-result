<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050714">
  <title>Hasil Result</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Assumption from brief: mockup font unspecified; using Orbitron + Exo 2 -->
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800;900&family=Orbitron:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23050914'/%3E%3Cpath d='M10 42L20 14h24l10 28H10z' fill='none' stroke='%23ff53b5' stroke-width='3'/%3E%3Cpath d='M16 20h32' stroke='%2353d8ff' stroke-width='3'/%3E%3Ccircle cx='18' cy='33' r='3' fill='%23ffce45'/%3E%3Ccircle cx='46' cy='33' r='3' fill='%23ffce45'/%3E%3C/svg%3E">
  <style>
    :root{
      --bg:#040511;
      --bg-2:#060a1c;
      --bg-3:#0b1030;
      --panel:#09142e;
      --panel-2:#0d1a39;
      --panel-3:#121034;
      --metal-1:#0b1230;
      --metal-2:#161239;
      --metal-3:#1f1743;
      --text:#f0f4ff;
      --muted:#8ea0ca;
      --line-blue:#53d8ff;
      --line-cyan:#5dafff;
      --line-purple:#9e62ff;
      --line-magenta:#ff53b5;
      --line-gold:#ffce45;
      --green:#4dffb6;
      --danger:#ff4775;
      --wallpaper-image:none;
      --wallpaper-blur:1.6px;
      --hero-height:132px;
      --command-height:68px;
      --card-radius:18px;
      --chrome-stroke:rgba(110,148,255,.20);
      --chrome-inner:rgba(255,255,255,.04);
      --copy-glass:rgba(255,255,255,.03);
      --font-ui:"Exo 2",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      --font-display:"Orbitron","Exo 2",sans-serif;
      --font-mono:"Consolas","Cascadia Mono","SFMono-Regular",ui-monospace,monospace;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      color:var(--text);
      font-family:var(--font-ui);
      background:
        radial-gradient(1100px 560px at 50% -2%, rgba(111,85,255,.18), transparent 62%),
        radial-gradient(900px 480px at 50% 118%, rgba(185,56,255,.12), transparent 58%),
        linear-gradient(180deg,#02040d 0%, #030511 34%, #050717 100%);
      overflow-x:hidden;
    }
    body::before{
      content:"";
      position:fixed;
      inset:-22px;
      background:
        linear-gradient(rgba(6,9,22,.16),rgba(6,9,22,.22)),
        var(--wallpaper-image),
        radial-gradient(40% 45% at 50% 100%, rgba(176,68,255,.12), transparent 68%),
        radial-gradient(26% 24% at 16% 24%, rgba(65,125,255,.16), transparent 72%),
        radial-gradient(28% 28% at 84% 26%, rgba(255,78,179,.16), transparent 72%);
      background-size:cover,cover,auto,auto,auto;
      background-position:center top,center top,50% 100%,16% 24%,84% 26%;
      background-repeat:no-repeat;
      filter:blur(var(--wallpaper-blur)) saturate(112%);
      transform:scale(1.04);
      pointer-events:none;
      z-index:0;
    }
    body::after{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        linear-gradient(180deg, rgba(2,4,12,.60), rgba(2,4,12,.18) 12%, rgba(2,4,12,.18) 76%, rgba(2,4,12,.74)),
        radial-gradient(circle at 50% 56%, transparent 36%, rgba(3,4,12,.36) 78%, rgba(1,2,8,.75) 100%);
      z-index:0;
    }

    a{color:inherit}
    button,input,select{font:inherit}
    button{cursor:pointer}
    ::selection{background:rgba(91,167,255,.30);color:#fff}

    .app{
      position:relative;
      z-index:1;
      width:min(1680px, calc(100% - 34px));
      margin:18px auto 42px;
      padding-inline:8px;
    }

    .ui-defs{
      position:absolute;
      width:0;height:0;
      overflow:hidden;
      pointer-events:none;
    }

    .shell{
      position:relative;
      isolation:isolate;
    }

    .frame-svg{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      pointer-events:none;
      overflow:visible;
    }

    /* ===== Header ===== */
    .topbar{
      position:relative;
      min-height:var(--hero-height);
      padding:18px 28px 18px 28px;
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      align-items:center;
      gap:18px;
    }

    .topbar .frame-shadow{
      position:absolute;
      inset:22px 48px -18px 48px;
      border-radius:42px;
      background:
        radial-gradient(66% 76% at 50% 0%, rgba(165,106,255,.22), transparent 65%),
        radial-gradient(22% 42% at 10% 50%, rgba(84,175,255,.18), transparent 68%),
        radial-gradient(22% 42% at 90% 50%, rgba(255,76,182,.18), transparent 68%);
      filter:blur(22px);
      opacity:.95;
      z-index:-1;
    }

    .topbar-content,
    .command-content{
      position:relative;
      z-index:2;
      display:contents;
    }

    .top-left{
      display:flex;
      align-items:center;
      gap:18px;
      min-width:0;
      padding-left:8px;
    }

    .status-pill{
      position:relative;
      isolation:isolate;
      min-width:136px;
      height:54px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:0 24px;
      color:#fff2f7;
      font:900 28px/1 var(--font-display);
      letter-spacing:.09em;
      text-transform:uppercase;
      text-shadow:0 0 20px rgba(255,78,155,.55), 0 0 10px rgba(255,78,155,.32);
      clip-path:polygon(8% 0, 92% 0, 100% 50%, 92% 100%, 8% 100%, 0 50%);
      background:
        linear-gradient(180deg, rgba(255,120,180,.14), rgba(255,44,108,.12)),
        linear-gradient(180deg, rgba(76,11,37,.86), rgba(35,7,18,.90));
      border:1px solid rgba(255,84,160,.34);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.20),
        inset 0 -10px 18px rgba(0,0,0,.30),
        0 0 22px rgba(255,68,150,.22),
        0 12px 28px rgba(0,0,0,.36);
      overflow:hidden;
      flex:0 0 auto;
    }
    .status-pill::before{
      content:"";
      position:absolute;
      inset:2px;
      clip-path:inherit;
      background:
        linear-gradient(180deg, rgba(255,255,255,.14), transparent 44%),
        linear-gradient(90deg, rgba(255,82,164,.18), transparent 38%, transparent 62%, rgba(255,82,164,.12));
      mix-blend-mode:screen;
      pointer-events:none;
    }
    .status-pill .status-dot{
      width:12px;height:12px;border-radius:50%;
      background:#ff799f;
      box-shadow:0 0 10px #ff648f, 0 0 24px rgba(255,87,145,.75);
      animation:pulseDot 1.6s ease-in-out infinite;
      flex:0 0 auto;
    }
    @keyframes pulseDot{
      0%,100%{transform:scale(1);opacity:1}
      50%{transform:scale(1.28);opacity:.72}
    }

    .title{
      margin:0;
      white-space:nowrap;
      font:900 clamp(28px,2.8vw,58px)/1 var(--font-display);
      letter-spacing:.08em;
      text-transform:uppercase;
      color:#eff4ff;
      text-shadow:
        0 2px 0 rgba(255,255,255,.10),
        0 0 18px rgba(132,170,255,.42),
        0 0 38px rgba(132,88,255,.22);
      transform:translateY(2px);
    }

    .stats{
      display:flex;
      gap:12px;
      align-items:center;
      min-height:54px;
      padding:0 16px;
      border-radius:18px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.05), transparent 34%),
        linear-gradient(180deg, rgba(11,24,55,.88), rgba(7,15,36,.94));
      border:1px solid rgba(101,134,222,.24);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        inset 0 -12px 18px rgba(0,0,0,.28),
        0 12px 24px rgba(0,0,0,.30),
        0 0 18px rgba(79,148,255,.08);
      flex:0 0 auto;
    }
    .stat{
      display:flex;
      align-items:center;
      gap:7px;
      color:#dfe7ff;
      font:800 17px/1 var(--font-display);
      letter-spacing:.06em;
      text-transform:uppercase;
    }
    .stat i{
      width:10px;height:10px;display:block;border-radius:50%;
      box-shadow:0 0 10px currentColor, 0 0 18px currentColor;
      background:currentColor;
      flex:0 0 auto;
    }
    .stat.total i{color:#48bbff}
    .stat.normal i{color:#50f0b7}
    .stat.hoki i{color:#c26cff}
    .stat b{
      display:inline-grid;
      place-items:center;
      min-width:22px;height:22px;
      padding:0 6px;
      border-radius:999px;
      background:rgba(255,255,255,.08);
      color:#f7fbff;
      font-size:14px;
      font-variant-numeric:tabular-nums;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.18);
    }

    .top-right{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:14px;
      min-width:0;
      padding-right:6px;
      flex-wrap:wrap;
    }

    .date-actions{
      display:flex;
      gap:12px;
      align-items:center;
      flex-wrap:nowrap;
    }

    .date-picker{
      position:relative;
      z-index:50;
      width:min(260px,100%);
      flex:0 0 auto;
    }

    .date-control,
    .today-btn,
    .refresh-btn,
    .sort-btn,
    .tab-btn,
    .copy-btn,
    .search-wrap{
      border:0;
      outline:0;
      color:#ecf0ff;
      background:transparent;
    }

    .date-control{
      position:relative;
      width:100%;
      height:58px;
      padding:0 18px;
      display:flex;
      align-items:center;
      gap:12px;
      border-radius:16px;
      font:800 18px/1 var(--font-display);
      letter-spacing:.04em;
      color:#f0f5ff;
      text-shadow:0 0 12px rgba(95,157,255,.18);
      background:
        linear-gradient(180deg, rgba(255,255,255,.05), transparent 36%),
        linear-gradient(180deg, rgba(8,18,45,.90), rgba(7,13,34,.96));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        inset 0 -12px 18px rgba(0,0,0,.32),
        0 12px 26px rgba(0,0,0,.34);
    }
    .date-control::before{
      content:"";
      position:absolute; inset:1px;
      border-radius:15px;
      border:1px solid rgba(84,120,220,.20);
      pointer-events:none;
    }
    .date-control:hover{
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.10),
        inset 0 -12px 18px rgba(0,0,0,.32),
        0 12px 26px rgba(0,0,0,.34),
        0 0 18px rgba(83,216,255,.12);
    }
    .date-control > svg:first-child{
      width:20px;height:20px; color:#f2f6ff; flex:0 0 auto;
      filter:drop-shadow(0 0 8px rgba(92,173,255,.35));
    }
    #dateDisplay{
      flex:1; min-width:0; text-align:left;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .date-chevron{
      width:18px;height:18px; flex:0 0 auto; color:#96a7d8;
      transition:transform .20s ease;
    }
    .date-picker.open .date-chevron{transform:rotate(180deg)}
    .date-picker.open .date-control{
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.10),
        inset 0 -12px 18px rgba(0,0,0,.32),
        0 12px 26px rgba(0,0,0,.34),
        0 0 28px rgba(83,216,255,.18);
    }

    .date-menu{
      position:absolute;
      top:calc(100% + 12px);
      right:0;
      width:min(336px, calc(100vw - 28px));
      padding:12px;
      display:none;
      border-radius:20px;
      background:
        linear-gradient(150deg, rgba(255,255,255,.075), transparent 28%),
        radial-gradient(120% 72% at 100% 0%, rgba(179,79,255,.18), transparent 52%),
        radial-gradient(100% 72% at 0% 100%, rgba(55,184,255,.14), transparent 56%),
        linear-gradient(180deg, rgba(9,17,42,.99), rgba(4,8,24,.995));
      border:1px solid rgba(113,151,255,.36);
      box-shadow:
        0 30px 60px rgba(0,0,0,.56),
        inset 0 1px 0 rgba(255,255,255,.10),
        inset 0 -20px 34px rgba(0,0,0,.24),
        0 0 36px rgba(84,132,255,.17),
        0 0 18px rgba(199,84,255,.08);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      overflow:hidden;
      z-index:1000;
    }
    .date-menu::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius:inherit;
      padding:1px;
      background:linear-gradient(135deg,rgba(83,216,255,.58),transparent 32%,transparent 66%,rgba(218,85,255,.46));
      -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
      -webkit-mask-composite:xor;
      mask-composite:exclude;
      pointer-events:none;
    }
    .date-picker.open .date-menu{
      display:block;
      animation:menuIn .18s cubic-bezier(.3,1.35,.5,1) forwards;
    }
    @keyframes menuIn{
      from{opacity:0;transform:translateY(-8px) scale(.975)}
      to{opacity:1;transform:translateY(0) scale(1)}
    }

    .calendar-header{
      position:relative;
      display:grid;
      grid-template-columns:38px minmax(0,1fr) 38px;
      align-items:center;
      gap:8px;
      min-height:42px;
      margin-bottom:9px;
      padding-bottom:9px;
      border-bottom:1px solid rgba(113,145,224,.18);
    }
    .calendar-title{
      min-width:0;
      text-align:center;
      color:#f5f8ff;
      font:900 14px/1 var(--font-display);
      letter-spacing:.075em;
      text-transform:uppercase;
      text-shadow:0 0 16px rgba(111,173,255,.24);
    }
    .calendar-nav{
      width:38px;
      height:38px;
      padding:0;
      display:grid;
      place-items:center;
      border:0;
      border-radius:11px;
      color:#e7eeff;
      background:
        linear-gradient(180deg,rgba(255,255,255,.08),transparent 46%),
        linear-gradient(180deg,rgba(24,36,80,.86),rgba(10,16,43,.94));
      box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 8px 18px rgba(0,0,0,.22);
      transition:color .16s ease,background .16s ease,box-shadow .16s ease,transform .16s ease;
    }
    .calendar-nav svg{width:17px;height:17px}
    .calendar-nav:not(:disabled):hover{
      color:#fff;
      transform:translateY(-1px);
      background:
        linear-gradient(180deg,rgba(255,255,255,.14),transparent 44%),
        linear-gradient(180deg,rgba(48,92,166,.88),rgba(46,29,111,.92));
      box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 0 18px rgba(83,216,255,.14),0 8px 18px rgba(0,0,0,.24);
    }
    .calendar-nav:disabled{
      opacity:.24;
      cursor:not-allowed;
      box-shadow:none;
    }

    .calendar-weekdays,
    .calendar-days{
      position:relative;
      display:grid;
      grid-template-columns:repeat(7,minmax(0,1fr));
      gap:4px;
    }
    .calendar-weekdays{
      margin-bottom:4px;
    }
    .calendar-weekday{
      height:26px;
      display:grid;
      place-items:center;
      color:#8fa2d1;
      font:900 9px/1 var(--font-display);
      letter-spacing:.06em;
      text-transform:uppercase;
    }
    .calendar-day{
      position:relative;
      width:100%;
      aspect-ratio:1/1;
      min-width:0;
      padding:0;
      display:grid;
      place-items:center;
      border:1px solid transparent;
      border-radius:10px;
      color:#dbe5ff;
      background:rgba(255,255,255,.025);
      font:800 12px/1 var(--font-ui);
      font-variant-numeric:tabular-nums;
      transition:transform .15s ease,color .15s ease,border-color .15s ease,background .15s ease,box-shadow .15s ease;
    }
    .calendar-day.outside-month:not(:disabled){
      color:#8494bd;
      background:rgba(255,255,255,.014);
    }
    .calendar-day:not(:disabled):hover{
      transform:translateY(-1px);
      color:#fff;
      border-color:rgba(83,216,255,.52);
      background:linear-gradient(145deg,rgba(42,134,216,.48),rgba(91,45,165,.44));
      box-shadow:0 0 16px rgba(83,216,255,.14),inset 0 1px 0 rgba(255,255,255,.12);
    }
    .calendar-day.today:not(.active){
      color:#8eeaff;
      border-color:rgba(83,216,255,.46);
      background:rgba(50,161,221,.14);
      box-shadow:inset 0 0 12px rgba(83,216,255,.07);
    }
    .calendar-day.active{
      color:#fff;
      border-color:rgba(218,166,255,.82);
      background:
        linear-gradient(180deg,rgba(255,255,255,.16),transparent 43%),
        linear-gradient(145deg,rgba(48,167,231,.90),rgba(117,55,207,.94));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.22),
        0 0 18px rgba(83,216,255,.24),
        0 0 24px rgba(194,81,255,.18);
    }
    .calendar-day:disabled{
      color:#71809f;
      opacity:.31;
      cursor:not-allowed;
      background:rgba(255,255,255,.018);
      border-color:transparent;
      box-shadow:none;
    }
    .calendar-day:disabled.outside-month{opacity:.18}
    .calendar-day .archive-dot{
      position:absolute;
      left:50%;
      bottom:4px;
      width:4px;
      height:4px;
      margin-left:-2px;
      border-radius:50%;
      background:#5ff2bd;
      box-shadow:0 0 8px rgba(95,242,189,.88);
    }
    .calendar-day.active .archive-dot{
      background:#fff;
      box-shadow:0 0 8px rgba(255,255,255,.88);
    }

    .calendar-footer{
      position:relative;
      margin-top:10px;
      padding-top:10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      border-top:1px solid rgba(113,145,224,.18);
    }
    .calendar-today{
      min-height:34px;
      padding:0 13px;
      border:1px solid rgba(83,216,255,.28);
      border-radius:10px;
      color:#eafaff;
      background:linear-gradient(145deg,rgba(32,125,199,.48),rgba(77,42,151,.46));
      font:900 10px/1 var(--font-display);
      letter-spacing:.075em;
      text-transform:uppercase;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.10);
      transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;
    }
    .calendar-today:hover{
      transform:translateY(-1px);
      border-color:rgba(83,216,255,.52);
      box-shadow:0 0 16px rgba(83,216,255,.15),inset 0 1px 0 rgba(255,255,255,.14);
    }
    .calendar-limit{
      color:#8395c2;
      text-align:right;
      font:800 9px/1.35 var(--font-display);
      letter-spacing:.055em;
      text-transform:uppercase;
    }

    .today-btn{
      position:relative;
      height:58px;
      min-width:148px;
      padding:0 22px;
      border-radius:16px;
      font:900 18px/1 var(--font-display);
      letter-spacing:.04em;
      color:#effcff;
      text-transform:uppercase;
      background:
        linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.02) 34%),
        linear-gradient(180deg, #39b8ff 0%, #0093ff 54%, #0f79ff 100%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.55),
        inset 0 -14px 22px rgba(0,0,0,.22),
        0 0 28px rgba(31,173,255,.34),
        0 15px 28px rgba(0,0,0,.34);
      clip-path:polygon(10% 0,90% 0,100% 18%,100% 82%,90% 100%,10% 100%,0 82%,0 18%);
      text-shadow:0 0 12px rgba(255,255,255,.30);
      flex:0 0 auto;
    }
    .today-btn:hover{
      transform:translateY(-1px);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.58),
        inset 0 -14px 22px rgba(0,0,0,.22),
        0 0 34px rgba(31,173,255,.44),
        0 15px 28px rgba(0,0,0,.34);
    }
    .today-btn:active{transform:translateY(0)}

    .updated{
      min-width:160px;
      text-align:left;
      padding:0 4px;
    }
    .updated small{
      display:block;
      margin-bottom:5px;
      color:#c9d4f6;
      opacity:.84;
      font:900 12px/1 var(--font-display);
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    .updated strong{
      display:block;
      color:#ffffff;
      font:800 14px/1.2 var(--font-mono);
      text-shadow:0 0 10px rgba(110,160,255,.18);
      white-space:nowrap;
    }

    .refresh-btn{
      width:58px;height:58px;
      display:grid; place-items:center;
      border-radius:16px;
      color:#dce5ff;
      background:
        linear-gradient(180deg, rgba(255,255,255,.06), transparent 36%),
        linear-gradient(180deg, rgba(19,23,62,.94), rgba(7,12,34,.98));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        inset 0 -14px 18px rgba(0,0,0,.28),
        0 12px 26px rgba(0,0,0,.34),
        0 0 20px rgba(170,77,255,.14);
      clip-path:polygon(18% 0,82% 0,100% 18%,100% 82%,82% 100%,18% 100%,0 82%,0 18%);
    }
    .refresh-btn:hover{
      color:#fff;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.12),
        inset 0 -14px 18px rgba(0,0,0,.28),
        0 12px 26px rgba(0,0,0,.34),
        0 0 24px rgba(170,77,255,.22);
    }
    .refresh-btn:hover svg{animation:spin 1.3s linear infinite}
    .refresh-btn svg{
      width:22px;height:22px;
      filter:drop-shadow(0 0 10px rgba(194,108,255,.32));
    }
    .refresh-btn.loading svg{
      animation:spin .68s linear infinite;
    }
    .refresh-btn:disabled{
      cursor:wait;
      color:#8feeff;
      opacity:.82;
    }
    @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

    /* ===== Integrated command shell ===== */
    .command-shell{
      position:relative;
      min-height:112px;
      margin-top:16px;
      padding:14px 24px 14px 24px;
    }

    .command-grid{
      position:relative;
      z-index:2;
      display:grid;
      grid-template-columns:minmax(0,1.18fr) minmax(340px,.92fr) auto;
      grid-template-areas:"search tabs sort";
      align-items:center;
      gap:18px;
      min-height:84px;
      padding-inline:6px;
    }

    .search-wrap{
      grid-area:search;
      position:relative;
      height:60px;
      display:flex;
      align-items:center;
      gap:12px;
      padding:0 18px 0 18px;
      border-radius:18px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.06), transparent 34%),
        linear-gradient(180deg, rgba(9,15,42,.94), rgba(5,10,29,.98));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        inset 0 -12px 18px rgba(0,0,0,.30),
        0 14px 28px rgba(0,0,0,.34);
      clip-path:polygon(3% 0, 97% 0, 100% 24%, 100% 76%, 97% 100%, 3% 100%, 0 76%, 0 24%);
    }
    .search-wrap::before{
      content:"";
      position:absolute; inset:2px;
      clip-path:inherit;
      border:1px solid rgba(184,76,255,.35);
      background:
        linear-gradient(90deg, rgba(255,74,184,.10), transparent 28%, transparent 68%, rgba(83,216,255,.10)),
        radial-gradient(180px 70px at 90% 50%, rgba(83,216,255,.12), transparent 72%);
      pointer-events:none;
    }
    .search-wrap:focus-within::before{
      border-color:rgba(83,216,255,.52);
      box-shadow:0 0 22px rgba(83,216,255,.16), inset 0 0 22px rgba(184,76,255,.08);
    }
    .search-wrap svg{
      width:22px;height:22px; flex:0 0 auto;
      color:#f6fbff;
      filter:drop-shadow(0 0 10px rgba(83,216,255,.28));
    }
    .search-wrap input{
      width:100%;
      border:0; outline:0; background:transparent;
      color:#eef4ff;
      font:700 20px/1 var(--font-ui);
      letter-spacing:.01em;
    }
    .search-wrap input::placeholder{
      color:#98a8d7;
    }

    .tabs{
      grid-area:tabs;
      position:relative;
      min-height:60px;
      padding:0;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:0;
      border:0;
      background:transparent;
      min-width:0;
    }
    .tabs::before{
      content:"";
      position:absolute; inset:0;
      border-radius:18px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.05), transparent 34%),
        linear-gradient(180deg, rgba(10,16,42,.94), rgba(6,11,28,.98));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        inset 0 -12px 18px rgba(0,0,0,.30),
        0 14px 28px rgba(0,0,0,.34);
      clip-path:polygon(3% 0, 97% 0, 100% 24%, 100% 76%, 97% 100%, 3% 100%, 0 76%, 0 24%);
      z-index:-1;
    }

    .tab-btn{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      min-height:60px;
      padding:0 20px;
      color:#cfd7fb;
      font:900 20px/1 var(--font-ui);
      white-space:nowrap;
      background:transparent;
      clip-path:polygon(7% 0, 93% 0, 100% 22%, 100% 78%, 93% 100%, 7% 100%, 0 78%, 0 22%);
      transition:transform .18s ease, filter .18s ease;
    }
    .tab-btn .tab-count{
      min-width:24px;height:24px; padding:0 7px;
      display:grid; place-items:center;
      border-radius:999px;
      background:rgba(255,255,255,.08);
      color:#eef4ff;
      font:900 12px/1 var(--font-display);
      font-variant-numeric:tabular-nums;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.14);
    }
    .tab-btn.active{
      color:#ffffff;
      background:
        linear-gradient(180deg, rgba(255,255,255,.12), transparent 42%),
        linear-gradient(180deg, rgba(122,91,255,.94), rgba(72,44,140,.88));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.18),
        inset 0 -12px 18px rgba(0,0,0,.20),
        0 0 20px rgba(172,116,255,.22);
    }
    .tab-btn.active .tab-count{
      background:rgba(255,255,255,.14);
    }
    .tab-btn .tab-count.hoki{
      background:rgba(70,255,183,.14);
      color:#dffff4;
      box-shadow:0 0 14px rgba(70,255,183,.12), inset 0 1px 0 rgba(255,255,255,.16);
    }
    .tab-btn:not(.active):hover{
      transform:translateY(-1px);
      filter:drop-shadow(0 0 10px rgba(83,216,255,.08));
    }

    .sort-actions{
      grid-area:sort;
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .sort-btn{
      position:relative;
      min-width:134px;
      height:58px;
      padding:0 20px;
      color:#d7defb;
      font:900 18px/1 var(--font-ui);
      background:
        linear-gradient(180deg, rgba(255,255,255,.04), transparent 34%),
        linear-gradient(180deg, rgba(10,16,42,.94), rgba(6,11,28,.98));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        inset 0 -12px 18px rgba(0,0,0,.30),
        0 14px 28px rgba(0,0,0,.34);
      clip-path:polygon(12% 0, 88% 0, 100% 22%, 100% 78%, 88% 100%, 12% 100%, 0 78%, 0 22%);
      white-space:nowrap;
      transition:transform .16s ease, box-shadow .16s ease, color .16s ease;
    }
    .sort-btn.active{
      color:#fff;
      background:
        linear-gradient(180deg, rgba(255,255,255,.12), transparent 43%),
        linear-gradient(180deg, rgba(126,91,255,.94), rgba(76,42,154,.90));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.18),
        inset 0 -12px 18px rgba(0,0,0,.22),
        0 0 18px rgba(165,88,255,.20),
        0 14px 28px rgba(0,0,0,.34);
    }
    .sort-btn:hover{
      transform:translateY(-1px);
    }

    /* ===== Grid ===== */
    .grid{
      margin-top:18px;
      display:grid;
      grid-template-columns:repeat(3, minmax(0,1fr));
      gap:18px;
      align-items:stretch;
      perspective:none;
      overflow-anchor:none;
    }

    .card{
      --accent:#ffce45;
      --accent-rgb:255,206,69;
      --line-2:#fff6b8;
      --frame-1:#1a1436;
      --frame-2:#0e1433;
      --body-grad-a:#151b3f;
      --body-grad-b:#09112a;
      position:relative;
      min-height:268px;
      padding:14px 16px 16px;
      display:flex;
      flex-direction:column;

      /*
        Card dibuat statis.
        Tidak ada transform 3D / naik / miring ketika cursor diarahkan.
      */
      transform:none;
      transform-style:flat;
      transition:filter .20s ease;
      backface-visibility:hidden;

      isolation:isolate;
    }

    .card[data-grid-ghost="true"]{
      margin:0;
      pointer-events:none;
      user-select:none;
      contain:layout style;
    }

    @media (prefers-reduced-motion: reduce){
      .card,
      .copy-btn,
      .toast{
        animation-duration:.01ms!important;
        transition-duration:.01ms!important;
      }
    }
    .card.multi{
      --accent:#cf6bff;
      --accent-rgb:207,107,255;
      --line-2:#f1b6ff;
      --frame-1:#231354;
      --frame-2:#0c1233;
      --body-grad-a:#18124a;
      --body-grad-b:#090f2f;
    }
    .card:hover{
      /*
        Tidak bergerak saat hover.
        Posisi, ukuran, dan kemiringan card tetap sama.
      */
      transform:none;
      filter:none;
    }

    .card-frame-svg{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      overflow:visible;
      pointer-events:none;
      z-index:0;
    }

    .card-ambient{
      position:absolute;
      inset:8% 4% 2% 4%;
      border-radius:38px;
      background:
        radial-gradient(34% 20% at 50% 0%, rgba(var(--accent-rgb),.22), transparent 70%),
        radial-gradient(58% 70% at 50% 90%, rgba(87,132,255,.10), transparent 66%);
      filter:blur(18px);
      opacity:.88;
      pointer-events:none;
      z-index:-1;
    }

    .card-titlebar{
      position:relative;
      z-index:2;
      min-height:46px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0 56px 0 26px;
      margin:0 0 12px;
      clip-path:polygon(4% 0, 96% 0, 100% 24%, 100% 76%, 96% 100%, 4% 100%, 0 76%, 0 24%);
      background:
        linear-gradient(180deg, rgba(255,255,255,.09), transparent 40%),
        linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.02)),
        linear-gradient(180deg, rgba(21,28,66,.68), rgba(13,18,46,.88));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        inset 0 -10px 16px rgba(0,0,0,.30);
    }

    .card-title{
      margin:0;
      color:var(--accent);
      text-align:center;
      font:900 17px/1 var(--font-display);
      letter-spacing:.16em;
      text-transform:uppercase;
      text-shadow:
        0 0 18px rgba(var(--accent-rgb), .32),
        0 1px 0 rgba(255,255,255,.10);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      width:100%;
    }

    .card-badge{
      position:absolute;
      top:-1px;
      right:14px;
      width:42px;
      height:42px;
      display:grid;
      place-items:center;
      color:var(--accent);
      z-index:3;
      filter:drop-shadow(0 0 12px rgba(var(--accent-rgb), .38));
    }
    .card-badge svg{
      width:18px;height:18px;
      position:relative;
      z-index:2;
    }
    .card-badge::before{
      content:"";
      position:absolute;
      inset:0;
      clip-path:polygon(20% 0, 100% 0, 100% 80%, 80% 100%, 0 100%, 0 18%);
      background:
        linear-gradient(180deg, rgba(255,255,255,.18), transparent 38%),
        linear-gradient(180deg, rgba(var(--accent-rgb),.28), rgba(17,16,39,.94));
      border:1px solid rgba(var(--accent-rgb),.54);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.18),
        inset 0 -10px 14px rgba(0,0,0,.28),
        0 0 18px rgba(var(--accent-rgb),.24);
    }

    .card-glass{
      position:relative;
      z-index:2;
      flex:1;
      display:flex;
      flex-direction:column;
      min-height:0;
      margin:0 10px 0;
      padding:16px 18px 0;
      border-radius:16px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.04), transparent 22%),
        radial-gradient(120% 80% at 50% -14%, rgba(var(--accent-rgb),.08), transparent 44%),
        linear-gradient(180deg, rgba(12,21,49,.92), rgba(7,13,31,.98));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.06),
        inset 0 -10px 16px rgba(0,0,0,.34);
      overflow:hidden;
    }
    .card-glass::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(130deg, rgba(255,255,255,.08), transparent 26%, transparent 72%, rgba(255,255,255,.03)),
        linear-gradient(90deg, transparent 0, rgba(var(--accent-rgb),.05) 18%, transparent 38%, transparent 62%, rgba(80,155,255,.05) 86%, transparent 100%);
      mix-blend-mode:screen;
      pointer-events:none;
    }

    .card-text{
      position:relative;
      z-index:2;
      flex:1;
      min-height:0;
      white-space:pre-wrap;
      word-break:break-word;
      color:#f0f4ff;
      font:700 12.5px/1.52 var(--font-mono);
      text-shadow:0 1px 2px rgba(0,0,0,.46);
      overflow-wrap:anywhere;
    }

    .copy-btn{
      position:relative;
      z-index:2;
      width:calc(100% - 20px);
      height:44px;
      margin:14px auto 0;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      border-radius:12px;
      clip-path:polygon(4% 0, 96% 0, 100% 30%, 100% 70%, 96% 100%, 4% 100%, 0 70%, 0 30%);
      background:
        linear-gradient(180deg, rgba(255,255,255,.10), transparent 42%),
        linear-gradient(180deg, rgba(31,38,82,.90), rgba(16,20,48,.96));
      color:#eef2ff;
      font:900 15px/1 var(--font-display);
      letter-spacing:.10em;
      text-transform:uppercase;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.14),
        inset 0 -12px 16px rgba(0,0,0,.28),
        0 10px 18px rgba(0,0,0,.24);
      transition:transform .16s ease, box-shadow .16s ease;
    }
    .copy-btn::before{
      content:"";
      position:absolute; inset:1px;
      clip-path:inherit;
      border:1px solid rgba(121,144,218,.22);
      pointer-events:none;
    }
    .card.multi .copy-btn::before{ border-color:rgba(197,119,255,.22); }
    .copy-btn:hover{
      transform:translateY(-1px);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.14),
        inset 0 -12px 16px rgba(0,0,0,.28),
        0 10px 18px rgba(0,0,0,.24),
        0 0 18px rgba(var(--accent-rgb), .14);
    }
    .copy-btn svg{
      width:15px;height:15px;
      flex:0 0 auto;
    }
    .copy-btn.copied,
    .copy-btn.copied:hover,
    .card.multi .copy-btn.copied,
    .card.multi .copy-btn.copied:hover{
      color:#eafff5;
      background:
        linear-gradient(180deg, rgba(255,255,255,.16), transparent 42%),
        linear-gradient(180deg, rgba(34,170,107,.96), rgba(15,107,70,.98));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.20),
        inset 0 -12px 16px rgba(0,0,0,.24),
        0 0 26px rgba(57,230,145,.32),
        0 10px 18px rgba(0,0,0,.24);
    }
    .card.copy-success{
      filter:drop-shadow(0 22px 30px rgba(0,0,0,.36));
    }

    /*
      Teks harus tetap tajam saat cursor berada tepat di area isi hasil.
      Hover 3D pada card sebelumnya membuat browser merasterisasi teks
      sehingga terlihat sedikit blur. Efek 3D hanya dimatikan ketika
      pointer berada di area .card-text, fungsi lain tetap sama.
    */
    .card:has(.card-text:hover){
      transform:none !important;
      filter:none !important;
    }

    .card-text:hover{
      text-rendering:geometricPrecision;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* Setiap baris tetap satu baris visual seperti data aslinya. */
    .card-line{
      display:block;
      min-height:1em;
    }

    /* Hanya baris Result dibuat lebih tebal agar angka hasil lebih jelas. */
    .card-line.result-line{
      color:#ffffff;
      font-weight:900;
      letter-spacing:.015em;
      text-shadow:
        0 1px 1px rgba(0,0,0,.72),
        0 0 8px rgba(120,170,255,.10);
    }

    @keyframes copyPop{
      0%{transform:scale(.97)}
      56%{transform:scale(1.025)}
      100%{transform:scale(1)}
    }
    .copy-btn.copied{
      animation:copyPop .34s ease;
    }

    /* ===== state and toast ===== */
    .state{
      margin-top:18px;
      min-height:280px;
      display:grid;
      place-items:center;
      text-align:center;
      padding:26px;
      border-radius:22px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.04), transparent 24%),
        linear-gradient(180deg, rgba(9,16,39,.92), rgba(4,8,22,.96));
      border:1px solid rgba(101,128,220,.22);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 20px 38px rgba(0,0,0,.34),
        0 0 26px rgba(84,122,255,.08);
    }
    .state h3{
      margin:0 0 10px;
      color:#ffffff;
      font:900 29px/1 var(--font-display);
      letter-spacing:.06em;
      text-transform:uppercase;
      text-shadow:0 0 18px rgba(95,158,255,.22);
    }
    .state p{
      margin:0;
      color:#c9d4f5;
      font:600 16px/1.65 var(--font-ui);
      max-width:68ch;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:26px;
      transform:translate(-50%,24px);
      opacity:0;
      pointer-events:none;
      z-index:500;
      min-width:240px;
      max-width:min(92vw, 620px);
      padding:14px 18px;
      border-radius:16px;
      font:900 14px/1.4 var(--font-ui);
      color:#061610;
      background:
        linear-gradient(180deg, rgba(255,255,255,.34), rgba(255,255,255,.06) 34%),
        linear-gradient(180deg, #94ffd2 0%, #59e9ae 50%, #2dcf8a 100%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.52),
        0 16px 38px rgba(0,0,0,.44),
        0 0 26px rgba(80,255,183,.26);
      transition:opacity .22s ease, transform .22s ease;
      text-align:center;
    }
    .toast.show{
      opacity:1;
      transform:translate(-50%,0);
    }
    .toast.error{
      color:#2a0710;
      background:
        linear-gradient(180deg, rgba(255,255,255,.34), rgba(255,255,255,.08) 34%),
        linear-gradient(180deg, #ffc3cf 0%, #ff8ea5 48%, #ff5f7f 100%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.52),
        0 16px 38px rgba(0,0,0,.44),
        0 0 26px rgba(255,103,143,.24);
    }

    /* ===== Two-mode loading effects ===== */
    .loading-overlay{
      --loading-duration:1800ms;
      --effect-a:#52d9ff;
      --effect-b:#bd63ff;
      position:fixed;
      inset:0;
      z-index:5000;
      display:grid;
      place-items:center;
      padding:20px;
      visibility:hidden;
      opacity:0;
      pointer-events:none;
      background:
        radial-gradient(80% 70% at 50% 42%,rgba(17,31,78,.56),transparent 72%),
        rgba(2,5,18,.84);
      transition:opacity .20s ease,visibility .20s ease;
      isolation:isolate;
    }
    .loading-overlay.show{
      visibility:visible;
      opacity:1;
      pointer-events:auto;
    }
    .loading-overlay.mode-date{
      --effect-a:#55dfff;
      --effect-b:#d067ff;
    }
    .loading-overlay.mode-refresh{
      --effect-a:#55f2c0;
      --effect-b:#44bfff;
    }
    .loading-grid{
      position:absolute;
      inset:0;
      opacity:.24;
      background-image:
        linear-gradient(rgba(92,139,255,.12) 1px,transparent 1px),
        linear-gradient(90deg,rgba(92,139,255,.12) 1px,transparent 1px);
      background-size:38px 38px;
      mask-image:radial-gradient(circle at center,#000 0,transparent 70%);
      animation:loadingGridDrift 8s linear infinite;
      pointer-events:none;
    }
    .loading-panel{
      position:relative;
      width:min(390px,calc(100vw - 32px));
      min-height:330px;
      padding:28px 28px 24px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      border:1px solid rgba(119,150,240,.30);
      border-radius:26px;
      background:
        linear-gradient(145deg,rgba(255,255,255,.085),transparent 28%),
        radial-gradient(90% 56% at 50% 0%,rgba(98,100,255,.18),transparent 64%),
        linear-gradient(180deg,rgba(10,18,48,.985),rgba(4,8,25,.995));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.11),
        inset 0 -26px 38px rgba(0,0,0,.28),
        0 34px 80px rgba(0,0,0,.58),
        0 0 44px color-mix(in srgb,var(--effect-a) 16%,transparent);
      transform:translateY(12px) scale(.965);
      transition:transform .24s cubic-bezier(.2,.85,.3,1);
    }
    .loading-overlay.show .loading-panel{
      transform:translateY(0) scale(1);
    }
    .loading-panel::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius:inherit;
      padding:1px;
      background:linear-gradient(135deg,var(--effect-a),transparent 30%,transparent 68%,var(--effect-b));
      -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
      -webkit-mask-composite:xor;
      mask-composite:exclude;
      opacity:.72;
      pointer-events:none;
    }
    .loading-panel::after{
      content:"";
      position:absolute;
      left:8%;
      right:8%;
      top:0;
      height:2px;
      background:linear-gradient(90deg,transparent,var(--effect-a),var(--effect-b),transparent);
      box-shadow:0 0 18px var(--effect-a);
      opacity:.76;
    }

    .date-loading-visual,
    .refresh-loading-visual{
      position:relative;
      width:132px;
      height:132px;
      margin-bottom:18px;
      flex:0 0 auto;
    }
    .date-loading-visual,
    .refresh-loading-visual{display:none}
    .loading-overlay.mode-date .date-loading-visual{display:block}
    .loading-overlay.mode-refresh .refresh-loading-visual{display:block}

    .date-orbit{
      position:absolute;
      border-radius:50%;
      border:1px solid rgba(114,169,255,.22);
    }
    .date-orbit::before,
    .date-orbit::after{
      content:"";
      position:absolute;
      width:7px;
      height:7px;
      border-radius:50%;
      background:var(--effect-a);
      box-shadow:0 0 12px var(--effect-a);
    }
    .orbit-one{
      inset:1px;
      border-top-color:var(--effect-a);
      border-right-color:rgba(208,103,255,.62);
      animation:dateOrbit 1.8s linear infinite;
    }
    .orbit-one::before{left:12px;top:17px}
    .orbit-one::after{right:8px;bottom:27px;background:var(--effect-b);box-shadow:0 0 12px var(--effect-b)}
    .orbit-two{
      inset:13px;
      border-bottom-color:var(--effect-b);
      border-left-color:rgba(85,223,255,.56);
      animation:dateOrbitReverse 1.35s linear infinite;
    }
    .orbit-two::before{right:5px;top:26px;width:5px;height:5px}
    .orbit-two::after{display:none}
    .date-core{
      position:absolute;
      inset:32px 35px 27px;
      display:grid;
      grid-template-columns:repeat(2,1fr);
      grid-template-rows:repeat(2,1fr);
      gap:5px;
      padding:24px 10px 10px;
      border:1px solid color-mix(in srgb,var(--effect-a) 62%,white 10%);
      border-radius:12px;
      background:
        linear-gradient(180deg,rgba(255,255,255,.12),transparent 28%),
        linear-gradient(145deg,rgba(35,95,162,.88),rgba(77,34,139,.92));
      box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 0 24px rgba(84,189,255,.25);
      animation:calendarFloat 1.6s ease-in-out infinite;
    }
    .date-core::before{
      content:"";
      position:absolute;
      left:0;right:0;top:15px;
      height:1px;
      background:rgba(255,255,255,.28);
    }
    .date-core i{
      position:absolute;
      top:-5px;
      width:4px;
      height:12px;
      border-radius:4px;
      background:#e9f9ff;
      box-shadow:0 0 8px var(--effect-a);
    }
    .date-core i:nth-child(1){left:15px}
    .date-core i:nth-child(2){left:50%;margin-left:-2px}
    .date-core i:nth-child(3){right:15px}
    .date-core span{
      border-radius:3px;
      background:rgba(235,246,255,.78);
      box-shadow:0 0 7px rgba(126,211,255,.22);
      animation:dateCellPulse 1.2s ease-in-out infinite;
    }
    .date-core span:nth-of-type(2){animation-delay:.14s}
    .date-core span:nth-of-type(3){animation-delay:.28s}
    .date-core span:nth-of-type(4){animation-delay:.42s;background:#e9b8ff}

    .refresh-ring{
      position:absolute;
      border-radius:50%;
      border:2px solid transparent;
    }
    .ring-one{
      inset:5px;
      border-top-color:var(--effect-a);
      border-right-color:rgba(68,191,255,.58);
      border-bottom-color:rgba(85,242,192,.16);
      animation:refreshOrbit .92s linear infinite;
      filter:drop-shadow(0 0 7px rgba(85,242,192,.32));
    }
    .ring-two{
      inset:21px;
      border-left-color:var(--effect-b);
      border-bottom-color:rgba(85,242,192,.52);
      animation:refreshOrbitReverse .68s linear infinite;
    }
    .refresh-loading-visual svg{
      position:absolute;
      inset:41px;
      width:50px;
      height:50px;
      color:#e9fffa;
      filter:drop-shadow(0 0 12px var(--effect-a));
      animation:refreshIconPulse 1s ease-in-out infinite;
    }
    .refresh-scan{
      position:absolute;
      left:5px;
      right:5px;
      top:50%;
      height:2px;
      background:linear-gradient(90deg,transparent,var(--effect-a),#fff,var(--effect-b),transparent);
      box-shadow:0 0 13px var(--effect-a);
      animation:refreshScan 1.1s ease-in-out infinite;
      z-index:2;
    }

    .loading-copy{
      position:relative;
      z-index:2;
      width:100%;
      text-align:center;
    }
    .loading-eyebrow{
      display:block;
      margin-bottom:8px;
      color:var(--effect-a);
      font:900 10px/1 var(--font-display);
      letter-spacing:.22em;
      text-transform:uppercase;
      text-shadow:0 0 12px color-mix(in srgb,var(--effect-a) 56%,transparent);
    }
    .loading-title{
      display:block;
      color:#f7f9ff;
      font:900 21px/1.15 var(--font-display);
      letter-spacing:.075em;
      text-transform:uppercase;
      text-shadow:0 0 20px rgba(114,171,255,.22);
    }
    .loading-subtitle{
      display:block;
      min-height:18px;
      margin-top:9px;
      color:#9eafd8;
      font:700 12px/1.45 var(--font-ui);
    }
    .loading-subtitle:empty{display:none}
    .loading-progress{
      position:relative;
      z-index:2;
      width:100%;
      height:5px;
      margin-top:22px;
      overflow:hidden;
      border-radius:99px;
      background:rgba(255,255,255,.065);
      box-shadow:inset 0 1px 2px rgba(0,0,0,.42);
    }
    .loading-progress i{
      display:block;
      width:100%;
      height:100%;
      border-radius:inherit;
      background:linear-gradient(90deg,var(--effect-a),var(--effect-b),#fff);
      box-shadow:0 0 12px var(--effect-a);
      transform-origin:left center;
      animation:loadingProgress var(--loading-duration) cubic-bezier(.2,.75,.25,1) forwards;
    }
    .loading-pulses{
      position:relative;
      z-index:2;
      display:flex;
      gap:6px;
      margin-top:14px;
    }
    .loading-pulses i{
      width:5px;
      height:5px;
      border-radius:50%;
      background:var(--effect-a);
      box-shadow:0 0 8px var(--effect-a);
      animation:loadingDot .9s ease-in-out infinite;
    }
    .loading-pulses i:nth-child(2){animation-delay:.15s;background:var(--effect-b);box-shadow:0 0 8px var(--effect-b)}
    .loading-pulses i:nth-child(3){animation-delay:.30s}

    @keyframes loadingGridDrift{to{transform:translate3d(38px,38px,0)}}
    @keyframes loadingProgress{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes loadingDot{0%,100%{opacity:.28;transform:scale(.72)}50%{opacity:1;transform:scale(1.12)}}
    @keyframes dateOrbit{to{transform:rotate(360deg)}}
    @keyframes dateOrbitReverse{to{transform:rotate(-360deg)}}
    @keyframes calendarFloat{0%,100%{transform:translateY(1px)}50%{transform:translateY(-4px)}}
    @keyframes dateCellPulse{0%,100%{opacity:.38}50%{opacity:1}}
    @keyframes refreshOrbit{to{transform:rotate(360deg)}}
    @keyframes refreshOrbitReverse{to{transform:rotate(-360deg)}}
    @keyframes refreshIconPulse{0%,100%{transform:scale(.94);opacity:.76}50%{transform:scale(1.05);opacity:1}}
    @keyframes refreshScan{0%,100%{transform:translateY(-43px);opacity:.12}50%{transform:translateY(43px);opacity:1}}

    @media (max-width:520px){
      .loading-panel{
        min-height:300px;
        padding:24px 20px 21px;
        border-radius:22px;
      }
      .date-loading-visual,
      .refresh-loading-visual{
        width:118px;
        height:118px;
        margin-bottom:14px;
        transform:scale(.90);
      }
      .loading-title{font-size:18px}
      .loading-subtitle{font-size:11px}
    }

    .hidden{display:none!important}

    /* ===== ambient ornaments ===== */
    .topbar .edge-flares,
    .command-shell .edge-flares{
      position:absolute;
      inset:-6px 0 auto;
      height:20px;
      pointer-events:none;
      z-index:1;
    }
    .edge-flares::before,
    .edge-flares::after{
      content:"";
      position:absolute;
      top:0;
      width:180px;
      height:100%;
      filter:blur(10px);
      opacity:.85;
    }
    .edge-flares::before{
      left:11%;
      background:linear-gradient(90deg, transparent, rgba(83,216,255,.44), transparent);
    }
    .edge-flares::after{
      right:11%;
      background:linear-gradient(90deg, transparent, rgba(255,84,184,.36), transparent);
    }

    .chrome-hairline{
      position:absolute;
      left:8%;
      right:8%;
      top:6px;
      height:3px;
      background:linear-gradient(90deg, transparent, rgba(92,163,255,.42) 18%, rgba(250,78,193,.50) 50%, rgba(92,163,255,.42) 82%, transparent);
      filter:blur(.2px) drop-shadow(0 0 8px rgba(168,98,255,.44));
      opacity:.95;
      pointer-events:none;
      z-index:1;
    }

    /* ===== scroll ===== */
    ::-webkit-scrollbar{width:11px;height:11px}
    ::-webkit-scrollbar-track{background:#070813}
    ::-webkit-scrollbar-thumb{
      background:linear-gradient(180deg, rgba(86,163,255,.52), rgba(185,88,255,.52));
      border-radius:999px;
      border:2px solid #070813;
    }

    /* ===== responsiveness ===== */
    @media (max-width:1440px){
      .app{width:min(100%, calc(100% - 18px));}
      .title{font-size:clamp(26px,2.5vw,48px)}
      .stats{gap:9px}
      .stat{font-size:15px}
      .command-grid{
        grid-template-columns:minmax(0,1fr) minmax(290px,.82fr) auto;
        gap:14px;
      }
      .sort-btn{min-width:122px}
    }
    @media (max-width:1180px){
      .topbar{
        grid-template-columns:1fr;
        gap:16px;
        padding-top:18px;
        padding-bottom:20px;
      }
      .top-right{justify-content:flex-start}
      .command-grid{
        grid-template-columns:1fr;
        grid-template-areas:
          "search"
          "tabs"
          "sort";
        align-items:stretch;
      }
      .sort-actions{justify-content:flex-start; flex-wrap:wrap}
      .grid{grid-template-columns:repeat(2, minmax(0,1fr))}
      .command-shell{padding-bottom:18px}
    }
    @media (max-width:760px){
      .app{margin:10px auto 30px;width:min(100%, calc(100% - 10px));padding-inline:0}
      .topbar{padding:14px 14px 16px}
      .top-left{flex-wrap:wrap;gap:12px}
      .top-right{gap:10px}
      .date-actions{flex-wrap:wrap}
      .date-picker{width:100%;max-width:none}
      .updated{min-width:0}
      .command-shell{padding:12px 12px 14px}
      .command-grid{padding-inline:0; gap:12px}
      .grid{grid-template-columns:1fr}
      .search-wrap input{font-size:16px}
      .tab-btn{font-size:17px}
      .sort-btn{font-size:16px}
      .status-pill{min-width:116px;height:46px;font-size:22px}
      .today-btn,.date-control,.refresh-btn{height:52px}
      .stats{padding:0 12px; min-height:48px; flex-wrap:wrap}
      .stat{font-size:14px}
    }


    /* ===== COMPACT SIZE OVERRIDE =====
       Seluruh tampilan diperkecil secara proporsional tanpa mengubah
       struktur HTML, desain SVG 3D, sumber data, maupun fungsi JavaScript.
    */
    @media (min-width:761px){
      :root{
        --hero-height:108px;
        --command-height:56px;
        --card-radius:15px;
      }

      .app{
        width:min(1500px, calc(100% - 30px));
        margin:12px auto 30px;
        padding-inline:5px;
      }

      .topbar{
        min-height:var(--hero-height);
        padding:12px 20px;
        gap:14px;
      }
      .topbar .frame-shadow{
        inset:18px 40px -14px;
        border-radius:34px;
        filter:blur(18px);
      }
      .top-left{
        gap:13px;
        padding-left:5px;
      }
      .status-pill{
        min-width:108px;
        height:44px;
        gap:8px;
        padding:0 18px;
        font-size:21px;
      }
      .status-pill .status-dot{
        width:9px;
        height:9px;
      }
      .title{
        font-size:clamp(24px,2.25vw,44px);
        letter-spacing:.075em;
      }
      .stats{
        gap:8px;
        min-height:44px;
        padding:0 12px;
        border-radius:14px;
      }
      .stat{
        gap:5px;
        font-size:13px;
      }
      .stat i{
        width:8px;
        height:8px;
      }
      .stat b{
        min-width:19px;
        height:19px;
        padding:0 5px;
        font-size:11px;
      }
      .top-right{
        gap:10px;
        padding-right:4px;
      }
      .date-actions{
        gap:9px;
      }
      .date-picker{
        width:min(218px,100%);
      }
      .date-control,
      .today-btn,
      .refresh-btn{
        height:48px;
      }
      .date-control{
        padding:0 14px;
        gap:9px;
        border-radius:13px;
        font-size:14px;
      }
      .date-control::before{
        border-radius:12px;
      }
      .date-control > svg:first-child{
        width:17px;
        height:17px;
      }
      .date-chevron{
        width:15px;
        height:15px;
      }
      .date-menu{
        top:calc(100% + 9px);
        width:min(314px, calc(100vw - 28px));
        padding:10px;
        border-radius:17px;
      }
      .calendar-header{
        grid-template-columns:34px minmax(0,1fr) 34px;
        min-height:38px;
        margin-bottom:7px;
        padding-bottom:7px;
      }
      .calendar-nav{
        width:34px;
        height:34px;
        border-radius:10px;
      }
      .calendar-nav svg{
        width:15px;
        height:15px;
      }
      .calendar-title{font-size:12px}
      .calendar-weekday{height:23px;font-size:8px}
      .calendar-day{font-size:11px;border-radius:9px}
      .calendar-day .archive-dot{bottom:3px}
      .calendar-footer{margin-top:8px;padding-top:8px}
      .calendar-today{min-height:31px;padding:0 11px;font-size:9px}
      .calendar-limit{font-size:8px}
      .today-btn{
        min-width:122px;
        padding:0 17px;
        border-radius:13px;
        font-size:14px;
      }
      .updated{
        min-width:136px;
        padding:0 2px;
      }
      .updated small{
        margin-bottom:4px;
        font-size:9px;
      }
      .updated strong{
        font-size:11px;
      }
      .refresh-btn{
        width:48px;
        border-radius:13px;
      }
      .refresh-btn svg{
        width:18px;
        height:18px;
      }

      .command-shell{
        min-height:92px;
        margin-top:10px;
        padding:10px 18px;
      }
      .command-grid{
        grid-template-columns:minmax(0,1.18fr) minmax(290px,.92fr) auto;
        gap:12px;
        min-height:68px;
        padding-inline:4px;
      }
      .search-wrap{
        height:49px;
        gap:9px;
        padding:0 14px;
        border-radius:14px;
      }
      .search-wrap svg{
        width:18px;
        height:18px;
      }
      .search-wrap input{
        font-size:16px;
      }
      .tabs{
        min-height:49px;
      }
      .tabs::before{
        border-radius:14px;
      }
      .tab-btn{
        min-height:49px;
        gap:8px;
        padding:0 15px;
        font-size:15px;
      }
      .tab-btn .tab-count{
        min-width:20px;
        height:20px;
        padding:0 6px;
        font-size:9px;
      }
      .sort-actions{
        gap:8px;
      }
      .sort-btn{
        min-width:108px;
        height:48px;
        padding:0 15px;
        font-size:14px;
      }

      .grid{
        margin-top:12px;
        gap:13px;
      }
      .card{
        min-height:222px;
        padding:10px 12px 12px;
      }
      .card:hover{
        transform:none;
        filter:none;
      }
      .card-titlebar{
        min-height:39px;
        padding:0 48px 0 21px;
        margin-bottom:9px;
      }
      .card-title{
        font-size:14px;
        letter-spacing:.14em;
      }
      .card-badge{
        right:11px;
        width:35px;
        height:35px;
      }
      .card-badge svg{
        width:15px;
        height:15px;
      }
      .card-glass{
        margin:0 8px;
        padding:12px 14px 0;
        border-radius:13px;
      }
      .card-text{
        font-size:10.5px;
        line-height:1.46;
      }
      .copy-btn{
        width:calc(100% - 16px);
        height:37px;
        margin-top:10px;
        gap:8px;
        border-radius:10px;
        font-size:12px;
      }
      .copy-btn svg{
        width:13px;
        height:13px;
      }

      .state{
        margin-top:12px;
        min-height:220px;
        padding:21px;
        border-radius:18px;
      }
      .state h3{
        margin-bottom:8px;
        font-size:23px;
      }
      .state p{
        font-size:13px;
      }
      .toast{
        bottom:20px;
        min-width:210px;
        padding:11px 15px;
        border-radius:13px;
        font-size:12px;
      }
    }

    /* Menjaga susunan tablet tetap responsif setelah diperkecil. */
    @media (min-width:761px) and (max-width:1180px){
      .command-grid{
        grid-template-columns:1fr;
      }
    }
    @media (min-width:761px) and (max-width:980px){
      .date-menu{
        left:0;
        right:auto;
      }
    }



    /* ===== FIX LAPISAN DROPDOWN TANGGAL =====
       Dropdown sebelumnya berada di dalam stacking context header,
       sehingga command bar yang ditulis setelah header menutupinya.
       Urutan lapisan ini hanya memperbaiki posisi tampilannya dan tidak
       mengubah struktur, desain, data, ataupun fungsi JavaScript.
    */
    .topbar{
      z-index:1000;
      overflow:visible;
    }
    .topbar .topbar-content,
    .topbar .top-right,
    .topbar .date-actions{
      overflow:visible;
    }
    .date-picker{
      z-index:1100;
    }
    .date-picker.open{
      z-index:1200;
    }
    .date-menu{
      z-index:1300;
    }
    .command-shell{
      z-index:100;
    }
    #stateBox,
    #resultGrid{
      position:relative;
      z-index:10;
    }

  </style>
</head>

          values="1 0 0 0 0

                  0 0 0 .45 0" result="shadow"/>
        <feMerge>

      </filter>
      <filter id="fxInnerRim" color-interpolation-filters="sRGB" x="-20%" y="-20%" width="140%" height="160%" filterUnits="objectBoundingBox">
        <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="blurAlpha"/>
        <feOffset in="blurAlpha" dx="0" dy="1" result="off1"/>

    function applyMarketActivity(rows=[]){
      let nextOrder=Object.values(marketActivity).reduce((highest,entry)=>{
        const order=Number(entry?.firstSeenOrder)||0;
        return Math.max(highest,order);
      },0)+1;

      const currentIds=new Set(rows.map(item=>item.id));

      for(const [id,entry] of Object.entries(marketActivity)){
        if(!currentIds.has(id)){
          marketActivity[id]={...entry,present:false};
        }
      }

      const tracked=rows.map(item=>{
        const signature=exactLinesSignature(item.lines);
        const previous=marketActivity[item.id];
        const firstSeenOrder=Number(previous?.firstSeenOrder)||nextOrder++;

        marketActivity[item.id]={
          signature,
          firstSeenOrder,
          present:true
        };

        return {...item,firstSeenOrder};
      });

      saveMarketActivity();
      return tracked;
    }

    function normalizeSnapshotDateKey(value=''){
      const clean=String(value||'').trim();
      if(!clean)return '';

      if(/^\d{4}-\d{2}-\d{2}$/.test(clean)){
        return clean;
      }

      let match=clean.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
      if(match){
        return `${match[3]}-${match[2]}-${match[1]}`;
      }

      match=clean.match(/^(\d{2})-(\d{2})-(\d{4})$/);
      if(match){
        return `${match[3]}-${match[2]}-${match[1]}`;
      }

      const parsed=new Date(clean);
      if(!Number.isNaN(parsed.getTime())){
        const formatter=new Intl.DateTimeFormat('en-CA',{
          timeZone:ARCHIVE_CONFIG.timezone,
          year:'numeric',
          month:'2-digit',
          day:'2-digit'
        });
        const parts=formatter.formatToParts(parsed);
        const map=Object.fromEntries(
          parts.map(part=>[part.type,part.value])
        );
        return `${map.year}-${map.month}-${map.day}`;
      }

      return clean;
    }

      const normalizedResponse={
        ...response,

      safeStorageWrite(
        snapshotCacheKey(normalizedResponse.dateKey),
        JSON.stringify({
          savedAt:Date.now(),
          response:normalizedResponse
        })
      );
    }

    function readSnapshotCache(dateKey){
      const raw=safeStorageRead(snapshotCacheKey(dateKey));
      if(!raw)return null;

      try{
        const cached=JSON.parse(raw);
        const age=Date.now()-Number(cached?.savedAt||0);
        const response=cached?.response;

        if(
          age<0 ||
          age>ARCHIVE_CONFIG.snapshotCacheMaxAgeMs ||
          !response?.found ||
          normalizeSnapshotDateKey(response.dateKey)!==dateKey ||
          !parseStoredCells(response.cells||[]).length
        ){
          safeStorageRemove(snapshotCacheKey(dateKey));
          return null;
        }

        return response;
      }catch{
        safeStorageRemove(snapshotCacheKey(dateKey));
        return null;
      }
    }

    function localizeDateLanguage(value=''){

        /\b(January|February|March|April|May|June|July|August|September|October|November|December|Jan|Feb|Mar|Apr|Jun|Jul|Aug|Sep|Oct|Nov|Dec|Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)\b/gi,
        matched=>{
          const translated=ENGLISH_DATE_WORDS[matched.toLowerCase()]||matched;
          return matchLetterCase(matched,translated);
        }
      );
    }

    function marketMatchKey(value=''){
      return normalizeForSearch(value).toUpperCase().replace(/[^A-Z0-9]/g,'');
    }

    const MARKET_RULE_MAP = new Map(
      MARKET_RULES.map((rule,order)=>[
        marketMatchKey(rule.name),
        Object.freeze({...rule,order})
      ])
    );

    function preserveSourceText(value=''){
      return String(value)
        .replace(/\r\n?/g,'\n')
        .split('\n')
        .map(line=>line.trim())
        .filter(line=>line.length)
        .join('\n');
    }

    if(!window.CSS)window.CSS={};
    if(!CSS.escape){
      CSS.escape=value=>String(value).replace(/[^a-zA-Z0-9_-]/g,char=>`\\${char}`);
    }

    function escapeHtml(value=''){
      return String(value).replace(/[&<>'"]/g,ch=>({
        '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'
      })[ch]);
    }

    function showToast(message,type='success'){
      clearTimeout(toastTimer);
      els.toast.textContent=message;
      els.toast.className=`toast ${type==='error'?'error':''} show`;
      toastTimer=setTimeout(()=>els.toast.classList.remove('show'),2200);
    }

    function hideLoadingEffect(version=loadingEffectVersion){
      if(version!==loadingEffectVersion)return;
      clearTimeout(loadingEffectTimer);
      els.loadingOverlay.classList.remove('show');
      els.loadingOverlay.setAttribute('aria-hidden','true');
      document.body.removeAttribute('aria-busy');
    }

    function showLoadingEffect(mode='refresh',options={}){
      const effect=LOADING_EFFECTS[mode]||LOADING_EFFECTS.refresh;
      const duration=Math.max(500,Number(options.duration)||effect.duration);
      const version=++loadingEffectVersion;

      clearTimeout(loadingEffectTimer);
      els.loadingEyebrow.textContent=options.eyebrow??effect.eyebrow;
      els.loadingTitle.textContent=options.title??effect.title;
      els.loadingSubtitle.textContent=options.subtitle??effect.subtitle;
      els.loadingOverlay.style.setProperty('--loading-duration',`${duration}ms`);

      // Reset kelas sebentar agar progress dan animasi selalu mulai dari awal.
      els.loadingOverlay.className='loading-overlay';
      void els.loadingOverlay.offsetWidth;
      els.loadingOverlay.classList.add('show',`mode-${mode}`);
      els.loadingOverlay.setAttribute('aria-hidden','false');
      document.body.setAttribute('aria-busy','true');

      loadingEffectTimer=setTimeout(
        ()=>hideLoadingEffect(version),
        duration
      );

      return version;
    }

    function showState(title,message){
      els.state.innerHTML=`<div><h3>${escapeHtml(title)}</h3><p>${escapeHtml(message)}</p></div>`;
      els.state.classList.remove('hidden');
      els.grid.classList.add('hidden');
    }

    function extractCellLines(cell){
      if(!cell)return [];
      const value=cell.f!==undefined&&cell.f!==null?cell.f:cell.v;
      if(value===undefined||value===null)return [];
      const exact=preserveSourceText(value);
      return exact?exact.split('\n'):[];
    }

    function isMarketHeader(line){
      return /^\s*Hasil\s+Pengeluaran(?:\s+|$)/i.test(line);
    }

    function marketNameFromHeader(header){
      const match=String(header).match(/^\s*Hasil\s+Pengeluaran\s+(.+?)\s*$/i);
      return match?match[1]:'';
    }

    function groupExactSheetData(lines){
      const groups=[];
      let current=null;

      const pushCurrent=()=>{
        if(current&&current.market)groups.push(current);
      };

      for(const line of lines){
        if(isMarketHeader(line)){
          pushCurrent();
          const name=marketNameFromHeader(line);
          current=name?{market:name,lines:[line]}:null;
          continue;
        }
        if(current)current.lines.push(line);
      }
      pushCurrent();
      return groups;
    }

    function parsePrizeRow(line=''){
      const normalized=String(line)
        .replace(/\u00a0/g,' ')
        .replace(/[\u200B-\u200D\uFEFF]/g,'')
        .replace(/[：﹕]/g,':')
        .trim();

      const match=normalized.match(/^Result(?:\s*(\d+))?\s*:\s*(.*)$/i);
      if(!match)return null;

      const value=String(match[2]??'').trim();
      const numberMatch=value.match(/^([0-9]+)/);
      if(!numberMatch)return null;

      return {
        number:match[1]?Number(match[1]):null,
        value,
        resultValue:numberMatch[1]
      };
    }

    function filledPrizeRows(lines=[]){
      return lines.map(parsePrizeRow).filter(Boolean);
    }

    function hasCompletePrize(lines,expectedPrize){
      const filled=filledPrizeRows(lines);

      if(expectedPrize===1){
        return filled.some(item=>item.resultValue);
      }

      const numbered=new Map();

      for(const item of filled){
        if(
          Number.isInteger(item.number) &&
          item.number>=1 &&
          item.number<=expectedPrize &&
          item.resultValue
        ){
          numbered.set(item.number,item.resultValue);
        }
      }

      for(let prizeNumber=1;prizeNumber<=expectedPrize;prizeNumber++){
        if(!numbered.has(prizeNumber))return false;
      }

      return true;
    }

    function dateTokensFromExactLines(lines=[]){
      const dateLine=lines.find(line=>/^\s*Hari\b/i.test(line))||'';
      const clean=normalizeForSearch(dateLine)
        .replace(/^Hari\s*/i,'')
        .replace(/,/g,'')
        .toLowerCase();
      const months={
        january:'01',february:'02',march:'03',april:'04',may:'05',june:'06',july:'07',august:'08',september:'09',october:'10',november:'11',december:'12',
        januari:'01',februari:'02',maret:'03',mei:'05',juni:'06',juli:'07',agustus:'08',oktober:'10',desember:'12'
      };
      let day='',month='',year='';
      for(const part of clean.split(/\s+/)){
        if(/^\d{4}$/.test(part))year=part;
        else if(/^\d{1,2}$/.test(part)&&!day)day=part.padStart(2,'0');
        else if(months[part])month=months[part];
      }
      return day&&month&&year?[`${year}-${month}-${day}`]:[];
    }

    function parseExactGroup(group,sourceIndex,rule){
      const resultCount=filledPrizeRows(group.lines).length;
      const localizedLines=group.lines.map(localizeDateLanguage);

      return {
        id:`market-${rule.order}`,
        index:rule.order,
        sourceIndex,
        market:group.market,
        lines:[...group.lines],
        localizedLines,
        expectedPrize:rule.prize,
        filledPrizeCount:resultCount,
        isHoki:marketMatchKey(group.market).includes('HOKIDRAW'),
        isMulti:rule.prize>1,
        searchText:normalizeForSearch(
          group.lines.join(' ')+' '+localizedLines.join(' ')
        ).toLowerCase(),
        dateTokens:dateTokensFromExactLines(group.lines)
      };
    }

    function parseExactLines(lines=[]){
      return groupExactSheetData(lines)
        .map((group,sourceIndex)=>{
          const marketKey=marketMatchKey(group.market);
          let rule=MARKET_RULE_MAP.get(marketKey);

          /*
            Semua pasaran dengan nama HOKIDRAW dibaca otomatis sebagai
            kategori Hokidraw walaupun jam/nama variannya belum ada di
            MARKET_RULES.

            Contoh yang sekarang terbaca:
            - HOKIDRAW 00:00
            - HOKIDRAW 12:00
            - HOKI DRAW 18:00

            Hokidraw memakai satu Result wajib berisi angka.
          */
          if(!rule&&marketKey.includes('HOKIDRAW')){
            rule={
              name:group.market,
              prize:1,
              order:MARKET_RULES.length+sourceIndex
            };
          }

          if(!rule)return null;
          if(!hasCompletePrize(group.lines,rule.prize))return null;
          return parseExactGroup(group,sourceIndex,rule);
        })
        .filter(Boolean)
        .sort((a,b)=>a.index-b.index);
    }

    function parseResponse(response){
      if(!response||response.status==='error'){
        const detail=response?.errors?.[0]?.detailed_message||response?.errors?.[0]?.message||'Google Sheets response is invalid.';
        throw new Error(detail);
      }
      const rows=response.table?.rows||[];
      const lines=[];
      for(const row of rows)lines.push(...extractCellLines(row.c?.[0]));
      return parseExactLines(lines);
    }

    function splitLegacyStoredText(value=''){
      const clean=String(value||'').trim();
      if(!clean)return [];

      if(
        clean.includes('Hasil Pengeluaran') &&
        clean.includes(',')
      ){
        return clean
          .split(
            /,\s*(?=(?:Hasil\s+Pengeluaran|Hari\b|Result(?:\s*\d+)?\s*:|Selamat\s+Kepada\s+Pemenang))/i
          )
          .map(part=>part.trim())
          .filter(Boolean);
      }

      return [clean];
    }

    function flattenStoredCells(value,result=[]){
      if(value===undefined||value===null)return result;

      if(Array.isArray(value)){
        value.forEach(item=>flattenStoredCells(item,result));
        return result;
      }

      if(typeof value==='object'){
        Object.values(value).forEach(
          item=>flattenStoredCells(item,result)
        );
        return result;
      }

      const text=String(value).trim();
      if(!text)return result;

      if(
        (text.startsWith('[')&&text.endsWith(']')) ||
        (text.startsWith('{')&&text.endsWith('}'))
      ){
        try{
          flattenStoredCells(JSON.parse(text),result);
          return result;
        }catch{}
      }

      splitLegacyStoredText(text).forEach(
        item=>result.push(item)
      );

      return result;
    }

    function parseStoredCells(cells=[]){
      const flattened=flattenStoredCells(cells);
      const lines=[];

      for(const value of flattened){
        const exact=preserveSourceText(value);
        if(exact)lines.push(...exact.split('\n'));
      }

      return parseExactLines(lines);
    }

    function requestGoogleSheet(params){
      return new Promise((resolve,reject)=>{
        const callbackName=`sheetCallback_${Date.now()}_${Math.random().toString(36).slice(2)}`;
        const script=document.createElement('script');
        let settled=false;
        const cleanup=()=>{
          clearTimeout(timer);
          script.remove();
          try{delete window[callbackName];}catch{window[callbackName]=undefined;}
        };
        const finish=(handler,value)=>{
          if(settled)return;
          settled=true;
          cleanup();
          handler(value);
        };
        window[callbackName]=response=>finish(resolve,response);
        const query=new URLSearchParams({
          ...params,
          tqx:`out:json;responseHandler:${callbackName}`,
          headers:'0',
          cacheBust:`${Date.now()}-${Math.random().toString(36).slice(2)}`
        });
        script.src=`https://docs.google.com/spreadsheets/d/${encodeURIComponent(CONFIG.spreadsheetId)}/gviz/tq?${query.toString()}`;
        script.async=true;
        script.onerror=()=>finish(reject,new Error('Request to Google Sheets failed to load.'));
        const timer=setTimeout(()=>finish(reject,new Error('Connection to Google Sheets timed out.')),CONFIG.requestTimeoutMs);
        document.head.appendChild(script);
      });
    }

    function extractSingleCellValue(response){
      if(!response||response.status==='error')return '';
      const cell=response.table?.rows?.[0]?.c?.[0];
      if(!cell)return '';
      const value=cell.f!==undefined&&cell.f!==null?cell.f:cell.v;
      return String(value??'').trim();
    }
