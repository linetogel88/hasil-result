
<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#05070f">
  <title>Hasil Result</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2305070f'/%3E%3Cpath d='M17 19h30v26H17z' rx='6' fill='%23102045' stroke='%235aa9ff' stroke-width='3'/%3E%3Cpath d='M23 27h18M23 34h13M23 41h16' stroke='%23f3c846' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root{
      --wallpaper-image:none;
      --wallpaper-blur:4px;
      --bg:#02040a;
      --bg-deep:#010207;
      --panel:rgba(7,13,27,.86);
      --panel-strong:rgba(8,16,34,.96);
      --panel-soft:rgba(12,23,45,.78);
      --panel-purple:rgba(25,12,45,.90);
      --text:#f7f9ff;
      --text-soft:#cbd7ef;
      --muted:#7787a9;
      --line:rgba(130,159,219,.15);
      --line-strong:rgba(83,180,255,.48);
      --blue:#4db8ff;
      --cyan:#4ee7ff;
      --green:#42efad;
      --gold:#ffd56a;
      --gold-deep:#d89a28;
      --purple:#c47cff;
      --pink:#ff68bc;
      --red:#ff5d79;
      --mono:"Cascadia Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace;
      --sans:Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      --shadow-xl:0 30px 90px rgba(0,0,0,.60);
      --shadow-lg:0 20px 55px rgba(0,0,0,.46);
      --shadow-md:0 12px 30px rgba(0,0,0,.34);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      color:var(--text);
      font-family:var(--sans);
      background:
        radial-gradient(circle at 50% -10%,rgba(36,96,190,.16),transparent 34rem),
        radial-gradient(circle at 78% 5%,rgba(134,57,202,.10),transparent 30rem),
        linear-gradient(180deg,#050915 0%,#02040a 48%,#010207 100%);
      background-attachment:fixed;
      overflow-x:hidden;
    }

    body::before{
      content:"";
      position:fixed;
      inset:-30px;
      z-index:0;
      pointer-events:none;
      background-image:
        linear-gradient(180deg,rgba(1,3,8,.76),rgba(2,5,12,.88)),
        linear-gradient(90deg,rgba(1,3,8,.48),rgba(2,5,12,.80) 25%,rgba(2,5,12,.90) 50%,rgba(2,5,12,.80) 75%,rgba(1,3,8,.48)),
        var(--wallpaper-image);
      background-size:cover,cover,cover;
      background-position:center top,center top,center top;
      background-repeat:no-repeat;
      filter:blur(var(--wallpaper-blur)) saturate(.82) contrast(1.06);
      transform:scale(1.045);
    }

    body::after{
      content:"";
      position:fixed;
      inset:0;
      z-index:0;
      pointer-events:none;
      background:
        linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px),
        radial-gradient(circle at 50% 28%,transparent 0 28%,rgba(0,0,0,.18) 68%,rgba(0,0,0,.56) 100%);
      background-size:44px 44px,44px 44px,auto;
      mask-image:linear-gradient(to bottom,rgba(0,0,0,.45),transparent 72%);
      -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.45),transparent 72%);
    }

    button,input{font:inherit}
    button{cursor:pointer}

    .app{
      position:relative;
      z-index:1;
      width:min(1480px,calc(100% - 34px));
      margin:18px auto 42px;
    }

    /* ===== TOPBAR ===== */
    .topbar{
      position:relative;
      z-index:50;
      min-height:72px;
      padding:12px 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      border:1px solid rgba(109,153,235,.19);
      border-radius:22px;
      background:
        linear-gradient(180deg,rgba(11,20,40,.96),rgba(5,10,23,.97));
      box-shadow:
        var(--shadow-xl),
        inset 0 1px 0 rgba(255,255,255,.055),
        inset 0 -1px 0 rgba(72,153,255,.05);
      backdrop-filter:blur(24px) saturate(145%);
      -webkit-backdrop-filter:blur(24px) saturate(145%);
      overflow:visible;
    }

    .topbar::before{
      content:"";
      position:absolute;
      left:22px;
      right:22px;
      top:0;
      height:1px;
      border-radius:999px;
      background:linear-gradient(90deg,transparent,rgba(79,200,255,.84),rgba(190,118,255,.62),transparent);
      box-shadow:0 0 20px rgba(79,200,255,.36);
      pointer-events:none;
    }

    .topbar::after{
      content:"";
      position:absolute;
      inset:0;
      border-radius:inherit;
      background:
        radial-gradient(240px circle at 8% 0,rgba(47,150,255,.10),transparent 70%),
        radial-gradient(260px circle at 92% 0,rgba(194,92,255,.08),transparent 70%);
      pointer-events:none;
    }

    .top-left,.top-right,.stats,.date-actions,.sort-actions{display:flex;align-items:center}
    .top-left{gap:14px;min-width:0;position:relative;z-index:1}
    .top-right{gap:11px;justify-content:flex-end;flex-wrap:wrap;position:relative;z-index:1}
    .date-actions{gap:9px}

    .status-pill{
      height:30px;
      padding:0 13px;
      display:inline-flex;
      align-items:center;
      gap:8px;
      border:1px solid rgba(255,93,121,.34);
      border-radius:999px;
      background:linear-gradient(180deg,rgba(123,24,48,.38),rgba(70,13,30,.40));
      color:#ff98aa;
      font-size:10px;
      font-weight:900;
      letter-spacing:.18em;
      text-transform:uppercase;
      white-space:nowrap;
      box-shadow:inset 0 0 18px rgba(255,93,121,.08),0 0 16px rgba(255,93,121,.07);
    }

    .status-dot{
      width:7px;height:7px;border-radius:50%;
      background:var(--red);
      box-shadow:0 0 0 4px rgba(255,93,121,.11),0 0 14px rgba(255,93,121,.92);
      animation:pulseDot 1.65s ease-in-out infinite;
    }
    @keyframes pulseDot{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.75);opacity:.55}}

    .title{
      margin:0;
      font-size:17px;
      font-weight:950;
      letter-spacing:.26em;
      white-space:nowrap;
      background:linear-gradient(180deg,#fff 0%,#d7e4ff 55%,#8bb9ff 100%);
      -webkit-background-clip:text;
      background-clip:text;
      -webkit-text-fill-color:transparent;
      filter:drop-shadow(0 0 14px rgba(83,184,255,.22));
    }

    .stats{
      gap:3px;
      min-height:34px;
      padding:4px;
      border:1px solid rgba(135,166,226,.11);
      border-radius:12px;
      background:rgba(255,255,255,.025);
      color:var(--muted);
      font-size:9px;
      font-weight:850;
      white-space:nowrap;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
    }

    .stat{
      min-height:25px;
      padding:0 9px;
      display:flex;
      align-items:center;
      gap:6px;
      border-radius:8px;
    }
    .stat + .stat{border-left:1px solid rgba(140,165,215,.10)}
    .stat i{width:6px;height:6px;border-radius:50%;display:block}
    .stat.total i{background:#a3b0c8;box-shadow:0 0 8px rgba(163,176,200,.55)}
    .stat.normal i{background:var(--blue);box-shadow:0 0 10px rgba(77,184,255,.75)}
    .stat.hoki i{background:var(--green);box-shadow:0 0 10px rgba(66,239,173,.72)}
    .stat b{color:#e1eaff;font-weight:950}

    /* ===== SHARED CONTROLS ===== */
    .date-control,.today-btn,.refresh-btn,.sort-btn,.tab-btn,.copy-btn,.search-wrap{
      border:1px solid var(--line);
      color:var(--text-soft);
      transition:border-color .2s ease,background .2s ease,color .2s ease,box-shadow .2s ease,transform .2s ease;
    }

    .date-picker{position:relative;z-index:35}
    .date-control{
      position:relative;
      height:38px;
      min-width:160px;
      padding:0 12px;
      display:flex;
      align-items:center;
      gap:9px;
      border-radius:11px;
      background:linear-gradient(180deg,rgba(13,26,53,.86),rgba(7,16,35,.92));
      color:#e4ecff;
      font-size:11px;
      font-weight:850;
      white-space:nowrap;
      overflow:hidden;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
    }
    .date-control:hover{border-color:rgba(77,184,255,.44);box-shadow:0 0 0 3px rgba(77,184,255,.07),0 0 20px rgba(77,184,255,.10)}
    .date-control>svg:first-child{width:15px;height:15px;color:#76a7db;flex:0 0 auto}
    .date-control #dateDisplay{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis}
    .date-chevron{width:13px!important;height:13px!important;color:#6d83aa!important;transition:transform .18s ease;flex:0 0 auto}
    .date-picker.open .date-chevron{transform:rotate(180deg)}
    .date-picker.open .date-control{border-color:rgba(77,184,255,.56);background:rgba(10,26,57,.97);box-shadow:0 0 0 3px rgba(77,184,255,.10),0 0 24px rgba(77,184,255,.16)}

    .date-menu{
      position:absolute;
      top:calc(100% + 9px);
      right:0;
      width:254px;
      padding:8px;
      display:none;
      border:1px solid rgba(83,150,241,.28);
      border-radius:16px;
      background:linear-gradient(180deg,rgba(8,16,34,.99),rgba(4,9,21,.99));
      box-shadow:0 28px 70px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.035),0 0 36px rgba(52,147,255,.10);
      backdrop-filter:blur(24px) saturate(150%);
      -webkit-backdrop-filter:blur(24px) saturate(150%);
      z-index:1000;
      overflow:hidden;
    }
    .date-picker.open .date-menu{display:block;animation:dateMenuIn .18s cubic-bezier(.4,1.4,.5,1)}
    @keyframes dateMenuIn{from{opacity:0;transform:translateY(-7px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}

    .date-option{
      width:100%;min-height:44px;padding:8px 11px;
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      border:1px solid transparent;border-radius:11px;
      color:#c8d5ef;background:transparent;text-align:left;cursor:pointer;
      transition:all .15s ease;
    }
    .date-option:hover{border-color:rgba(83,155,255,.24);background:linear-gradient(90deg,rgba(22,48,96,.62),rgba(12,30,66,.48));transform:translateX(2px)}
    .date-option.active{border-color:rgba(78,220,255,.42);background:linear-gradient(90deg,rgba(22,109,183,.56),rgba(17,47,104,.58));color:#fff;box-shadow:0 0 20px rgba(78,220,255,.13),inset 0 0 0 1px rgba(78,220,255,.08)}
    .date-option-main{display:flex;flex-direction:column;gap:3px;min-width:0}
    .date-option-day{color:#f5f8ff;font-size:11px;font-weight:900}
    .date-option-date{color:#8294bb;font-size:9px;font-weight:700}
    .date-option-badge{min-width:51px;height:21px;padding:0 8px;display:grid;place-items:center;border-radius:999px;background:rgba(255,255,255,.05);color:#8495b9;font-size:8px;font-weight:900;white-space:nowrap}
    .date-option.active .date-option-badge{background:rgba(66,224,255,.16);color:#84eaff;box-shadow:0 0 12px rgba(66,224,255,.20)}

    .today-btn{
      height:38px;padding:0 15px;border-radius:11px;
      border-color:rgba(70,210,255,.52);
      background:linear-gradient(180deg,#36c8ff 0%,#1687d9 100%);
      color:#fff;font-size:10px;font-weight:950;white-space:nowrap;
      box-shadow:0 10px 24px rgba(12,116,197,.28),inset 0 1px 0 rgba(255,255,255,.32),0 0 18px rgba(54,200,255,.18);
      text-shadow:0 1px 2px rgba(0,0,0,.28);
    }
    .today-btn:hover{transform:translateY(-1px);box-shadow:0 14px 28px rgba(12,116,197,.36),inset 0 1px 0 rgba(255,255,255,.38),0 0 26px rgba(54,200,255,.28)}
    .today-btn:active{transform:translateY(0)}

    .updated{text-align:left;line-height:1.08;min-width:124px}
    .updated small{display:block;margin-bottom:5px;color:#7181a4;font-size:8px;font-weight:950;letter-spacing:.15em;text-transform:uppercase}
    .updated strong{font-size:10px;color:#dce6fb;white-space:nowrap;font-family:var(--mono);letter-spacing:.02em}

    .refresh-btn{
      width:38px;height:38px;padding:0;display:grid;place-items:center;border-radius:11px;
      background:linear-gradient(180deg,rgba(12,25,52,.88),rgba(7,15,32,.90));
      color:#7e99c5;
    }
    .refresh-btn:hover{color:#c6e1ff;border-color:rgba(77,184,255,.44);box-shadow:0 0 0 3px rgba(77,184,255,.07),0 0 20px rgba(77,184,255,.14)}
    .refresh-btn:hover svg{animation:spin 1.25s linear infinite}
    .refresh-btn svg{width:16px;height:16px}
    @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

    /* ===== CONTROL ROW ===== */
    .control-row{position:relative;z-index:2;margin-top:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
    .search-wrap{
      position:relative;height:48px;padding:0 16px;display:flex;align-items:center;gap:11px;border-radius:15px;
      background:linear-gradient(180deg,rgba(9,20,44,.94),rgba(5,13,31,.95));
      box-shadow:var(--shadow-md),inset 0 1px 0 rgba(255,255,255,.025);
      overflow:hidden;
    }
    .search-wrap::after{content:"";position:absolute;left:0;top:10px;bottom:10px;width:2px;border-radius:99px;background:linear-gradient(180deg,var(--cyan),var(--blue));box-shadow:0 0 12px rgba(78,231,255,.65);opacity:.78}
    .search-wrap:focus-within{border-color:rgba(77,184,255,.44);box-shadow:var(--shadow-md),0 0 0 3px rgba(77,184,255,.09),0 0 28px rgba(77,184,255,.13)}
    .search-wrap svg{width:18px;height:18px;color:#6e8bb9;flex:0 0 auto;transition:.2s ease}
    .search-wrap:focus-within svg{color:var(--cyan);filter:drop-shadow(0 0 6px rgba(78,231,255,.5))}
    .search-wrap input{width:100%;border:0;outline:0;background:transparent;color:#f3f7ff;font-size:13px}
    .search-wrap input::placeholder{color:#63769c}

    .sort-actions{gap:7px;padding:4px;border:1px solid rgba(122,153,211,.12);border-radius:15px;background:rgba(5,12,28,.86);box-shadow:var(--shadow-md)}
    .sort-btn{min-width:86px;height:40px;padding:0 14px;border-radius:11px;border-color:transparent;background:transparent;font-size:10px;font-weight:950;color:#687da4}
    .sort-btn:hover{color:#b7d8ff;background:rgba(46,108,181,.10)}
    .sort-btn.active{color:#eff7ff;border-color:rgba(83,168,255,.28);background:linear-gradient(180deg,rgba(27,70,130,.82),rgba(13,37,79,.86));box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 0 18px rgba(77,184,255,.13)}

    /* ===== TABS ===== */
    .tabs{
      position:relative;z-index:1;margin-top:14px;padding:5px;display:grid;grid-template-columns:1fr 1fr;gap:5px;
      border:1px solid rgba(113,144,203,.13);border-radius:16px;
      background:linear-gradient(180deg,rgba(6,14,32,.94),rgba(3,9,22,.96));
      box-shadow:var(--shadow-md),inset 0 1px 0 rgba(255,255,255,.02);
    }
    .tab-btn{height:42px;padding:0 14px;border-radius:11px;border-color:transparent;background:transparent;color:#566b92;font-size:11px;font-weight:950;display:flex;align-items:center;justify-content:center;gap:9px;position:relative;overflow:hidden}
    .tab-btn:hover{color:#9eb8e3;background:rgba(39,78,135,.08)}
    .tab-btn.active{color:#f3f7ff;border-color:rgba(84,156,255,.30);background:linear-gradient(180deg,rgba(23,55,108,.90),rgba(11,31,68,.92));box-shadow:inset 0 1px 0 rgba(255,255,255,.055),0 0 24px rgba(77,184,255,.13)}
    .tab-btn.active::after{content:"";position:absolute;left:24%;right:24%;bottom:0;height:2px;border-radius:99px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);box-shadow:0 0 12px rgba(78,231,255,.7)}
    .tab-count{min-width:20px;height:18px;padding:0 6px;border-radius:999px;display:grid;place-items:center;background:rgba(255,255,255,.06);color:#8aa0c8;font-size:8px}
    .tab-count.hoki{background:rgba(66,239,173,.13);color:#68efb6;box-shadow:0 0 10px rgba(66,239,173,.15)}

    /* ===== GRID & CARDS ===== */
    .grid{margin-top:16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}

    .card{
      position:relative;
      min-height:208px;
      padding:16px 16px 14px;
      display:flex;
      flex-direction:column;
      border:1px solid rgba(78,145,238,.23);
      border-radius:20px;
      background:
        linear-gradient(150deg,rgba(15,31,64,.94),rgba(6,15,34,.96) 62%,rgba(4,10,24,.98));
      box-shadow:
        0 22px 50px rgba(0,0,0,.44),
        inset 0 1px 0 rgba(255,255,255,.045),
        inset 0 -1px 0 rgba(72,140,255,.05);
      overflow:hidden;
      isolation:isolate;
      transition:transform .24s ease,border-color .24s ease,box-shadow .24s ease;
    }

    .card::before{
      content:"";
      position:absolute;
      inset:0;
      z-index:-1;
      background:
        radial-gradient(300px circle at 0 0,rgba(61,160,255,.18),transparent 56%),
        linear-gradient(115deg,transparent 34%,rgba(255,255,255,.025) 47%,transparent 58%);
      opacity:.96;
      pointer-events:none;
      transition:transform .5s ease,opacity .3s ease;
    }

    .card::after{
      content:"";
      position:absolute;
      left:0;
      top:22px;
      bottom:22px;
      width:3px;
      border-radius:0 99px 99px 0;
      background:linear-gradient(180deg,var(--cyan),var(--blue),rgba(77,184,255,.15));
      box-shadow:0 0 18px rgba(77,184,255,.7);
      pointer-events:none;
    }

    .card:hover{
      transform:translateY(-5px);
      border-color:rgba(79,186,255,.52);
      box-shadow:
        0 30px 70px rgba(0,0,0,.54),
        0 0 0 1px rgba(79,186,255,.06),
        0 0 34px rgba(77,184,255,.12),
        inset 0 1px 0 rgba(255,255,255,.065);
    }
    .card:hover::before{transform:translateX(14px);opacity:1.14}

    .card.multi{
      border-color:rgba(181,91,255,.28);
      background:linear-gradient(150deg,rgba(39,22,76,.94),rgba(18,12,48,.96) 58%,rgba(9,8,28,.98));
    }
    .card.multi::before{background:radial-gradient(320px circle at 0 0,rgba(190,91,255,.18),transparent 56%),linear-gradient(115deg,transparent 34%,rgba(255,255,255,.026) 47%,transparent 58%)}
    .card.multi::after{background:linear-gradient(180deg,var(--pink),var(--purple),rgba(196,124,255,.15));box-shadow:0 0 18px rgba(196,124,255,.72)}
    .card.multi:hover{border-color:rgba(200,119,255,.55);box-shadow:0 30px 70px rgba(0,0,0,.54),0 0 0 1px rgba(196,124,255,.07),0 0 36px rgba(196,124,255,.14),inset 0 1px 0 rgba(255,255,255,.065)}

    .card-title{
      position:relative;
      margin:0 0 15px;
      padding:0 0 12px;
      text-align:center;
      color:var(--gold);
      font-family:var(--mono);
      font-size:12px;
      font-weight:950;
      letter-spacing:.18em;
      line-height:1.25;
      text-transform:uppercase;
      text-shadow:0 0 16px rgba(255,213,106,.26),0 1px 2px rgba(0,0,0,.45);
    }
    .card-title::before{content:"";position:absolute;left:50%;bottom:0;width:110px;height:2px;border-radius:99px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,var(--gold),transparent);box-shadow:0 0 10px rgba(255,213,106,.44)}
    .card-title::after{display:none}
    .card.multi .card-title{color:#d999ff;text-shadow:0 0 16px rgba(196,124,255,.32),0 1px 2px rgba(0,0,0,.45)}
    .card.multi .card-title::before{background:linear-gradient(90deg,transparent,var(--pink),var(--purple),transparent);box-shadow:0 0 10px rgba(196,124,255,.48)}

    .card-text{
      position:relative;
      flex:1;
      white-space:pre-wrap;
      word-break:break-word;
      color:#f5f8ff;
      font-family:var(--mono);
      font-size:11.7px;
      font-weight:720;
      line-height:1.58;
      letter-spacing:.005em;
      text-shadow:0 1px 2px rgba(0,0,0,.46);
    }

    .copy-btn{
      width:100%;height:36px;margin-top:15px;padding:0 13px;border-radius:11px;
      display:flex;align-items:center;justify-content:center;gap:8px;
      color:#8fa8d1;font-size:9px;font-weight:950;letter-spacing:.15em;text-transform:uppercase;
      background:linear-gradient(180deg,rgba(24,56,105,.78),rgba(12,33,72,.82));
      box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
    }
    .copy-btn::before{content:"";position:absolute;pointer-events:none}
    .card.multi .copy-btn{background:linear-gradient(180deg,rgba(67,39,121,.78),rgba(38,23,86,.84));color:#b89cdd}
    .copy-btn:hover{color:#ecf6ff;border-color:rgba(77,184,255,.46);box-shadow:0 0 0 3px rgba(77,184,255,.07),0 0 20px rgba(77,184,255,.14),inset 0 1px 0 rgba(255,255,255,.05)}
    .card.multi .copy-btn:hover{color:#f4e8ff;border-color:rgba(196,124,255,.50);box-shadow:0 0 0 3px rgba(196,124,255,.07),0 0 20px rgba(196,124,255,.15),inset 0 1px 0 rgba(255,255,255,.05)}
    .copy-btn svg{width:13px;height:13px;transition:transform .2s ease}

    let allResults = [];

    };

    // Menyimpan status tombol yang terakhir berhasil disalin.
    // Status ini tetap dipakai saat kartu dirender ulang oleh update realtime.
    let copiedMarketId = '';

    let copiedEffectVersion = 0;

    // Menyimpan urutan pertama kali setiap pasaran muncul lengkap.
    // Pasaran yang muncul lebih dulu akan tetap berada di atas.
    // Pasaran baru berikutnya otomatis ditambahkan di bawah tanpa
    // menggeser urutan pasaran yang sudah lebih dulu tampil.
    const MARKET_ACTIVITY_KEY = 'hasil-result-market-first-seen-order-v2';
    let marketActivity = loadMarketActivity();

    function loadMarketActivity(){
      try{
        const saved=JSON.parse(localStorage.getItem(MARKET_ACTIVITY_KEY)||'{}');
        return saved&&typeof saved==='object'?saved:{};
      }catch{
        return {};
      }
    }

    function saveMarketActivity(){
      try{
        localStorage.setItem(MARKET_ACTIVITY_KEY,JSON.stringify(marketActivity));
      }catch{}
    }

    function exactLinesSignature(lines=[]){
      return JSON.stringify(lines);
    }

    function applyMarketActivity(rows=[]){
      let nextOrder=Object.values(marketActivity).reduce((highest,entry)=>{
        const order=Number(entry?.firstSeenOrder)||0;
        return Math.max(highest,order);
      },0)+1;

      const currentIds=new Set(rows.map(item=>item.id));

      // Data yang sedang belum lengkap boleh menghilang sementara,
      // tetapi urutan pertamanya tetap disimpan apabila muncul kembali.
      for(const [id,entry] of Object.entries(marketActivity)){
        if(!currentIds.has(id)){
          marketActivity[id]={...entry,present:false};
        }
      }

      const tracked=rows.map(item=>{
        const signature=exactLinesSignature(item.lines);
        const previous=marketActivity[item.id];
        const firstSeenOrder=Number(previous?.firstSeenOrder)||nextOrder++;

        marketActivity[item.id]={
          signature,
          firstSeenOrder,
          present:true
        };

        return {...item,firstSeenOrder};
      });

      saveMarketActivity();
      return tracked;
    }

    function normalizeForSearch(value=''){
      return String(value).replace(/\s+/g,' ').trim();
    }

    const ENGLISH_DATE_WORDS = Object.freeze({
      january:'Januari',
      february:'Februari',
      march:'Maret',
      april:'April',
      may:'Mei',
      june:'Juni',
      july:'Juli',
      august:'Agustus',
      september:'September',
      october:'Oktober',
      november:'November',
      december:'Desember',
      jan:'Jan',
      feb:'Feb',
      mar:'Mar',
      apr:'Apr',
      jun:'Jun',
      jul:'Jul',
      aug:'Agu',
      sep:'Sep',
      oct:'Okt',
      nov:'Nov',
      dec:'Des',
      monday:'Senin',
      tuesday:'Selasa',
      wednesday:'Rabu',
      thursday:'Kamis',
      friday:'Jumat',
      saturday:'Sabtu',
      sunday:'Minggu'
    });

    function matchLetterCase(source,replacement){
      if(source===source.toUpperCase())return replacement.toUpperCase();
      if(source===source.toLowerCase())return replacement.toLowerCase();
      return replacement;
    }

    function localizeDateLanguage(value=''){
      return String(value).replace(
        /\b(January|February|March|April|May|June|July|August|September|October|November|December|Jan|Feb|Mar|Apr|Jun|Jul|Aug|Sep|Oct|Nov|Dec|Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)\b/gi,
        matched=>{
          const translated=ENGLISH_DATE_WORDS[matched.toLowerCase()]||matched;
          return matchLetterCase(matched,translated);
        }
      );
    }

    // Pencocokan nama pasaran hanya dipakai untuk mencocokkan daftar aturan.
    // Teks yang tampil di kartu tetap persis dari Google Sheet.
    function marketMatchKey(value=''){
      return normalizeForSearch(value).toUpperCase().replace(/[^A-Z0-9]/g,'');
    }

    const MARKET_RULE_MAP = new Map(
      MARKET_RULES.map((rule,order)=>[
        marketMatchKey(rule.name),
        Object.freeze({...rule,order})
      ])
    );

    function preserveSourceText(value=''){
      return String(value)
        .replace(/\r\n?/g,'\n')
        .split('\n')
        .map(line=>line.trim())
        .filter(line=>line.length)
        .join('\n');
    }

    if(!window.CSS)window.CSS={};
    if(!CSS.escape){
      CSS.escape=value=>String(value).replace(/[^a-zA-Z0-9_-]/g,char=>`\\${char}`);
    }

    function escapeHtml(value=''){
      return String(value).replace(/[&<>'"]/g,ch=>({
        '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'
      })[ch]);
    }

    function showToast(message,type='success'){
      clearTimeout(toastTimer);
      els.toast.textContent=message;
      els.toast.className=`toast ${type==='error'?'error':''} show`;
      toastTimer=setTimeout(()=>els.toast.classList.remove('show'),2200);
    }

    function showState(title,message){
      els.state.innerHTML=`<div><h3>${escapeHtml(title)}</h3><p>${escapeHtml(message)}</p></div>`;
      els.state.classList.remove('hidden');
      els.grid.classList.add('hidden');
    }

    function extractCellLines(cell){
      if(!cell)return [];
      const value=cell.f!==undefined&&cell.f!==null?cell.f:cell.v;
      if(value===undefined||value===null)return [];
      const exact=preserveSourceText(value);
      return exact?exact.split('\n'):[];
    }

    function isMarketHeader(line){
      return /^\s*Hasil\s+Pengeluaran(?:\s+|$)/i.test(line);
    }

    function marketNameFromHeader(header){
      const match=String(header).match(/^\s*Hasil\s+Pengeluaran\s+(.+?)\s*$/i);
      return match?match[1]:'';
    }

    function groupExactSheetData(lines){
      const groups=[];
      let current=null;

      const pushCurrent=()=>{
        if(current&&current.market)groups.push(current);
      };

      for(const line of lines){
        if(isMarketHeader(line)){
          pushCurrent();
          const market=marketNameFromHeader(line);
          current=market?{market,lines:[line]}:null;
          continue;
        }
        if(current)current.lines.push(line);
      }
      pushCurrent();
      return groups;
    }

    function parsePrizeRow(line=''){
      // Normalisasi hanya untuk pemeriksaan kelengkapan.
      // Tulisan yang tampil tetap memakai teks asli Google Sheet.
      const normalized=String(line)
        .replace(/\u00a0/g,' ')
        .replace(/[\u200B-\u200D\uFEFF]/g,'')
        .replace(/[：﹕]/g,':')
        .trim();

      const match=normalized.match(/^Result(?:\s*(\d+))?\s*:\s*(.*)$/i);
      if(!match)return null;

      const value=String(match[2]??'').trim();

      // Result wajib benar-benar diawali angka.
      // Contoh valid:
      // 0000
      // 0312
      // 0312 , SHIO : KAMBING
      //
      // Contoh tidak valid:
      // kosong
      // , SHIO : KAMBING
      // SHIO : KAMBING
      // -, _, atau tanda placeholder lain
      const numberMatch=value.match(/^([0-9]+)/);
      if(!numberMatch)return null;

      return {
        number:match[1]?Number(match[1]):null,
        value,
        resultValue:numberMatch[1]
      };
    }

    function filledPrizeRows(lines=[]){
      return lines.map(parsePrizeRow).filter(Boolean);
    }

    function hasCompletePrize(lines,expectedPrize){
      const filled=filledPrizeRows(lines);

      if(expectedPrize===1){
        // Pasaran 1 prize wajib memiliki satu Result yang benar-benar berisi angka.
        return filled.some(item=>item.resultValue);
      }

      // Pasaran 3 prize wajib memiliki Result 1, Result 2, dan Result 3,
      // dan setiap Result wajib berisi angka. Nilai 0000 tetap valid.
      const numbered=new Map();

      for(const item of filled){
        if(
          Number.isInteger(item.number) &&
          item.number>=1 &&
          item.number<=expectedPrize &&
          item.resultValue
        ){
          numbered.set(item.number,item.resultValue);
        }
      }

      for(let prizeNumber=1;prizeNumber<=expectedPrize;prizeNumber++){
        if(!numbered.has(prizeNumber))return false;
      }

      return true;
    }

    function dateTokensFromExactLines(lines=[]){
      const dateLine=lines.find(line=>/^\s*Hari\b/i.test(line))||'';
      const clean=normalizeForSearch(dateLine)
        .replace(/^Hari\s*/i,'')
        .replace(/,/g,'')
        .toLowerCase();
      const months={
        january:'01',february:'02',march:'03',april:'04',may:'05',june:'06',july:'07',august:'08',september:'09',october:'10',november:'11',december:'12',
        januari:'01',februari:'02',maret:'03',mei:'05',juni:'06',juli:'07',agustus:'08',oktober:'10',desember:'12'
      };
      let day='',month='',year='';
      for(const part of clean.split(/\s+/)){
        if(/^\d{4}$/.test(part))year=part;
        else if(/^\d{1,2}$/.test(part)&&!day)day=part.padStart(2,'0');
        else if(months[part])month=months[part];
      }
      return day&&month&&year?[`${year}-${month}-${day}`]:[];
    }

    function parseExactGroup(group,sourceIndex,rule){
      const resultCount=filledPrizeRows(group.lines).length;
      const localizedLines=group.lines.map(localizeDateLanguage);

      return {
        id:`market-${rule.order}`,
        index:rule.order,
        sourceIndex,
        market:group.market,
        lines:[...group.lines],
        localizedLines,
        expectedPrize:rule.prize,
        filledPrizeCount:resultCount,
        isHoki:/\bHOKIDRAW\b/i.test(group.market),
        isMulti:rule.prize>1,
        // Pencarian mendukung tulisan asli Inggris dan tampilan Indonesia.
        searchText:normalizeForSearch(
          group.lines.join(' ')+' '+localizedLines.join(' ')
        ).toLowerCase(),
        dateTokens:dateTokensFromExactLines(group.lines)
      };
    }

    function parseExactLines(lines=[]){
      return groupExactSheetData(lines)
        .map((group,sourceIndex)=>{
          const rule=MARKET_RULE_MAP.get(marketMatchKey(group.market));
          // Pasaran di luar daftar resmi tidak ditampilkan.
          if(!rule)return null;
          // Data hanya tampil setelah semua Result wajib sudah terisi.
          // Nilai 0000 tetap dianggap valid.
          if(!hasCompletePrize(group.lines,rule.prize))return null;
          return parseExactGroup(group,sourceIndex,rule);
        })
        .filter(Boolean)
        .sort((a,b)=>a.index-b.index);
    }

    function parseResponse(response){
      if(!response||response.status==='error'){
        const detail=response?.errors?.[0]?.detailed_message||response?.errors?.[0]?.message||'Respons Google Sheets tidak valid.';
        throw new Error(detail);
      }
      const rows=response.table?.rows||[];
      const lines=[];
      for(const row of rows)lines.push(...extractCellLines(row.c?.[0]));
      return parseExactLines(lines);
    }

    function parseStoredCells(cells=[]){
      const lines=[];
      for(const value of cells){
        const exact=preserveSourceText(value);
        if(exact)lines.push(...exact.split('\n'));
      }
      return parseExactLines(lines);
    }

    function requestGoogleSheet(params){
      return new Promise((resolve,reject)=>{
        const callbackName=`sheetCallback_${Date.now()}_${Math.random().toString(36).slice(2)}`;
        const script=document.createElement('script');
        let settled=false;
        const cleanup=()=>{
          clearTimeout(timer);
          script.remove();
          try{delete window[callbackName];}catch{window[callbackName]=undefined;}
        };
        const finish=(handler,value)=>{
          if(settled)return;
          settled=true;
          cleanup();
          handler(value);
        };
        window[callbackName]=response=>finish(resolve,response);
        const query=new URLSearchParams({
          ...params,
          tqx:`out:json;responseHandler:${callbackName}`,
          headers:'0',
          cacheBust:`${Date.now()}-${Math.random().toString(36).slice(2)}`
        });
        script.src=`https://docs.google.com/spreadsheets/d/${encodeURIComponent(CONFIG.spreadsheetId)}/gviz/tq?${query.toString()}`;
        script.async=true;
        script.onerror=()=>finish(reject,new Error('Permintaan ke Google Sheets gagal dimuat.'));
        const timer=setTimeout(()=>finish(reject,new Error('Waktu koneksi ke Google Sheets habis.')),CONFIG.requestTimeoutMs);
        document.head.appendChild(script);
      });
    }

    function extractSingleCellValue(response){
      if(!response||response.status==='error')return '';
      const cell=response.table?.rows?.[0]?.c?.[0];
      if(!cell)return '';
      const value=cell.f!==undefined&&cell.f!==null?cell.f:cell.v;
      return String(value??'').trim();
    }

    async function loadWallpaperDirectFromSheet(){
      // Arsip tanggal lama dan hari yang sudah terkunci memakai wallpaper database.
      if(!isViewingToday()||dashboardMeta.todayLocked)return;

      try{
        const response=await requestGoogleSheet({
          sheet:'Background',
          range:'A2'
        });
        const url=extractSingleCellValue(response);
        applyWallpaper(url);
      }catch(error){
        console.warn('Wallpaper A2 tidak dapat dibaca langsung:',error);
      }
    }

    function isGoogleWebApp(){
      return Boolean(window.google&&google.script&&google.script.run);
    }

    function serverCall(functionName,...args){
      return new Promise((resolve,reject)=>{
        if(!isGoogleWebApp()){
          // Mode HTML biasa: fungsi live Google Sheet tetap berjalan,
          // sedangkan database Apps Script dilewati tanpa pesan ke pengguna.
          reject(Object.assign(
            new Error('SERVER_MODE_UNAVAILABLE'),
            {silentServerError:true}
          ));
          return;
        }

        let settled=false;
        const timer=setTimeout(()=>{
          if(settled)return;
          settled=true;
          reject(new Error('Koneksi database Google Apps Script terlalu lama.'));
        },ARCHIVE_CONFIG.serverTimeoutMs);

        const finish=(handler,value)=>{
          if(settled)return;
          settled=true;
          clearTimeout(timer);
          handler(value);
        };

        const runner=google.script.run
          .withSuccessHandler(value=>finish(resolve,value))
          .withFailureHandler(error=>finish(
            reject,
            new Error(error?.message||String(error)||'Terjadi kesalahan pada database.')
          ));

        runner[functionName](...args);
      });
    }

    function safeCssUrl(value=''){
      return String(value).replace(/["\\\n\r]/g,'');
    }

    function setDarkWallpaper(){
      document.body.style.backgroundImage=
        'radial-gradient(circle at 50% 0,rgba(72,70,150,.10),transparent 34rem),linear-gradient(180deg,#070a18 0%,#040611 100%)';
      document.body.style.backgroundSize='cover';
      document.body.style.backgroundPosition='center top';
      document.body.style.backgroundAttachment='fixed';
      document.body.style.setProperty('--wallpaper-image','none');
    }

    function setWallpaperImage(source){
      document.body.style.backgroundImage=
        'radial-gradient(circle at 50% 0,rgba(72,70,150,.10),transparent 34rem),linear-gradient(180deg,#070a18 0%,#040611 100%)';
      document.body.style.backgroundSize='cover';
      document.body.style.backgroundPosition='center top';
      document.body.style.backgroundAttachment='fixed';
      document.body.style.setProperty('--wallpaper-image', `url("${source}")`);
    }

    async function loadWallpaperThroughProxy(clean){
      if(!clean||wallpaperProxyRequestUrl===clean)return;
      wallpaperProxyRequestUrl=clean;

      try{
        const response=await serverCall('getWallpaperDataUrl',clean);
        if(appliedWallpaperUrl!==clean)return;
        if(!response?.ok||!response.dataUrl){
          throw new Error('Server tidak mengembalikan data gambar.');
        }

        const proxyImage=new Image();
        proxyImage.onload=()=>{
          if(appliedWallpaperUrl!==clean)return;
          setWallpaperImage(response.dataUrl);
        };
        proxyImage.onerror=()=>{
          if(appliedWallpaperUrl!==clean)return;
          setDarkWallpaper();
          showToast('Wallpaper gagal dimuat. Gunakan menu Tes File Wallpaper.','error');
        };
        proxyImage.src=response.dataUrl;
      }catch(error){
        if(appliedWallpaperUrl!==clean)return;
        setDarkWallpaper();

        if(error?.silentServerError||error?.message==='SERVER_MODE_UNAVAILABLE'){
          console.info('Proxy wallpaper Apps Script dilewati pada mode HTML biasa.');
          return;
        }

        console.error('Proxy wallpaper gagal:',error);
        showToast('Wallpaper gagal dimuat.','error');
      }finally{
        if(wallpaperProxyRequestUrl===clean)wallpaperProxyRequestUrl='';
      }
    }

    function applyWallpaper(url=''){
      const clean=safeCssUrl(url);

      if(clean===appliedWallpaperUrl)return;
      appliedWallpaperUrl=clean;

      if(!clean){
        wallpaperProxyRequestUrl='';
        setDarkWallpaper();
        return;
      }

      // Coba link langsung terlebih dahulu.
      const image=new Image();
      image.onload=()=>{
        if(appliedWallpaperUrl!==clean)return;
        setWallpaperImage(clean);
      };
      image.onerror=()=>{
        if(appliedWallpaperUrl!==clean)return;
        console.warn('Hotlink langsung gagal, mencoba proxy Apps Script:',clean);
        loadWallpaperThroughProxy(clean);
      };

      // Cache-bust agar URL yang sama tetap mengambil versi gambar terbaru.
      const separator=clean.includes('?')?'&':'?';
      image.src=`${clean}${separator}dashboard_refresh=${Date.now()}`;
    }

    function getWibTodayKey(){
      const parts=new Intl.DateTimeFormat('en-CA',{
        timeZone:ARCHIVE_CONFIG.timezone,
        year:'numeric',
        month:'2-digit',
        day:'2-digit'
      }).formatToParts(new Date());
      const map=Object.fromEntries(parts.map(part=>[part.type,part.value]));
      return `${map.year}-${map.month}-${map.day}`;
    }

    function shiftDateKey(dateKey,days){
      const [year,month,day]=dateKey.split('-').map(Number);
      const utcDate=new Date(Date.UTC(year,month-1,day));
      utcDate.setUTCDate(utcDate.getUTCDate()+days);
      return [
        utcDate.getUTCFullYear(),
        String(utcDate.getUTCMonth()+1).padStart(2,'0'),
        String(utcDate.getUTCDate()).padStart(2,'0')
      ].join('-');
    }

    function formatDateOption(dateKey){
      const [year,month,day]=dateKey.split('-').map(Number);
      const date=new Date(Date.UTC(year,month-1,day,12,0,0));
      const dayName=new Intl.DateTimeFormat('id-ID',{
        weekday:'long',
        timeZone:'UTC'
      }).format(date);
      const fullDate=new Intl.DateTimeFormat('id-ID',{
        day:'2-digit',
        month:'long',
        year:'numeric',
        timeZone:'UTC'
      }).format(date);
      return {dayName,fullDate};
    }

    function getSevenDateOptions(){
      const today=dashboardMeta.today||getWibTodayKey();
      return Array.from({length:7},(_,index)=>shiftDateKey(today,-index));
    }

    function closeDateMenu(){
      els.datePicker.classList.remove('open');
      els.datePickerButton.setAttribute('aria-expanded','false');

    function openDateMenu(){

      els.datePicker.classList.add('open');

    function toggleDateMenu(){
      if(els.datePicker.classList.contains('open'))closeDateMenu();
      else openDateMenu();
    }

    function renderDateMenu(){
      const selected=els.dateFilter.value||dashboardMeta.today||getWibTodayKey();
      const today=dashboardMeta.today||getWibTodayKey();
      const available=new Set(dashboardMeta.availableDates||[]);

      els.dateMenu.innerHTML=getSevenDateOptions().map(dateKey=>{
        const info=formatDateOption(dateKey);
        const isToday=dateKey===today;
        const isActive=dateKey===selected;
        const hasArchive=isToday||available.has(dateKey);
        const badge=isToday?'HARI INI':(hasArchive?'TERSIMPAN':'BELUM ADA');

        return `
          <button class="date-option ${isActive?'active':''}" type="button" role="option"
                  aria-selected="${isActive?'true':'false'}" data-date-value="${dateKey}">
            <span class="date-option-main">
              <span class="date-option-day">${escapeHtml(info.dayName)}</span>
              <span class="date-option-date">${escapeHtml(info.fullDate)}</span>
            </span>
            <span class="date-option-badge">${badge}</span>

      }).join('');

    function clearDisplayedResults(){
      allResults=[];
      lastDataSignature='';

      els.grid.innerHTML='';
      updateCounts();
      els.grid.classList.add('hidden');
    }

    function resetDateSelectionToToday(){
      const today=dashboardMeta.today||getWibTodayKey();

      clearTimeout(copiedResetTimer);
      copiedMarketId='';
      copiedUntil=0;
      resetAllCopyVisuals();

      currentDataMode='live';
      currentSnapshotDate='';
      setSelectedDateDisplay(today);

    async function selectDashboardDate(value,{silent=false}={}){
      if(!value)return;

      const today=dashboardMeta.today||getWibTodayKey();

      setSelectedDateDisplay(value);
      closeDateMenu();

      // Setiap pergantian tanggal langsung membersihkan tampilan tanggal lama,
      // supaya kartu hari ini tidak terlihat saat pengguna memilih tanggal lain.
      clearTimeout(copiedResetTimer);
      copiedMarketId='';
      copiedUntil=0;
      resetAllCopyVisuals();
      clearDisplayedResults();

      if(value===today){
        currentDataMode='live';
        currentSnapshotDate='';

        if(dashboardMeta.todayLocked){
          const found=await loadStoredSnapshot(today,{silent:true});
          if(!found)showNoResultForDate(today);
        }else{
          await loadSheetData({silent:true});

          if(!allResults.length){
            showNoResultForDate(today);
          }
        }
        return;
      }

      currentDataMode='snapshot';
      currentSnapshotDate=value;

      // Bila metadata sudah menyatakan tanggal belum tersimpan,
      // tampilkan pesan kosong secara langsung tanpa menunggu server.
      const available=new Set(dashboardMeta.availableDates||[]);
      if(!available.has(value)){
        showNoResultForDate(value);
        return;
      }

      const found=await loadStoredSnapshot(value,{silent:true});
      if(!found)showNoResultForDate(value);
    }

    function selectedDateKey(){
      return els.dateFilter.value||dashboardMeta.today||'';
    }

    function isViewingToday(){
      const selected=els.dateFilter.value;
      return !selected||!dashboardMeta.today||selected===dashboardMeta.today;
    }

    function updateDateLimits(meta={}){
      const today=meta.today||getWibTodayKey();
      // Maksimal tujuh pilihan: hari ini + enam hari sebelumnya.
      els.dateFilter.max=today;
      els.dateFilter.min=shiftDateKey(today,-6);
      renderDateMenu();
    }

    async function loadStoredSnapshot(dateKey,{silent=true}={}){
      if(!dateKey)return false;

      try{
        const response=await serverCall('getStoredSnapshot',dateKey);
        if(!response?.found){
          showNoResultForDate(dateKey);
          return false;
        }

        const parsed=parseStoredCells(response.cells||[]);
        currentDataMode='snapshot';
        currentSnapshotDate=dateKey;
        applyWallpaper(response.wallpaper||dashboardMeta.wallpaper||'');

        if(!parsed.length){
          showNoResultForDate(dateKey);
          return false;
        }

        allResults=parsed;
        lastDataSignature=dataSignature(parsed);
        confirmedEmptyCycles=0;
        updateLastUpdateText(new Date());
        renderResults();
        return true;
      }catch(error){
        if(error?.silentServerError||error?.message==='SERVER_MODE_UNAVAILABLE'){
          console.info('Arsip Apps Script tidak tersedia pada mode HTML biasa.');
          return false;
        }

        console.error('Gagal membaca database arsip:',error);
        if(!silent)showToast('Data tanggal tersebut belum dapat dibaca.','error');
        return false;
      }
    }

    async function loadDashboardMeta({silent=true}={}){
      try{
        const meta=await serverCall('getDashboardMeta');
        if(!meta?.ok)throw new Error(meta?.message||'Metadata dashboard tidak valid.');

        dashboardMeta={
          today:meta.today||'',
          todayLocked:Boolean(meta.todayLocked),
          availableDates:Array.isArray(meta.availableDates)?meta.availableDates:[],
          oldestDate:meta.oldestDate||'',
          wallpaper:meta.wallpaper||'',
          wallpaperSource:meta.wallpaperSource||''
        };

        updateDateLimits(dashboardMeta);

        if(!els.dateFilter.value&&dashboardMeta.today){
          setSelectedDateDisplay(dashboardMeta.today);
        }else{
          renderDateMenu();
        }

        const selected=els.dateFilter.value;

        // Wallpaper hari ini hanya dipakai saat membuka data hari ini.
        // Saat melihat arsip, wallpaper yang tersimpan bersama tanggal tersebut
        // tidak akan ditimpa oleh wallpaper terbaru.
        if(!selected||!dashboardMeta.today||selected===dashboardMeta.today){
          applyWallpaper(dashboardMeta.wallpaper);
        }

        if(selected&&dashboardMeta.today&&selected!==dashboardMeta.today){
          if(currentDataMode!=='snapshot'||currentSnapshotDate!==selected){
            await loadStoredSnapshot(selected,{silent});
          }
          return;
        }

        if(dashboardMeta.todayLocked&&dashboardMeta.today){
          if(currentDataMode!=='snapshot'||currentSnapshotDate!==dashboardMeta.today){
            await loadStoredSnapshot(dashboardMeta.today,{silent});
          }
          return;
        }

        if(currentDataMode!=='live'){
          currentDataMode='live';
          currentSnapshotDate='';
          await loadSheetData({silent:true});
        }
      }catch(error){
        // Ketika file dibuka sebagai HTML biasa, database Apps Script memang
        // tidak tersedia. Kesalahan ini cukup disimpan di console dan tidak
        // perlu ditampilkan pada dashboard.
        if(error?.silentServerError||error?.message==='SERVER_MODE_UNAVAILABLE'){
          console.info('Metadata Apps Script dilewati karena dashboard bukan mode Web App.');
          return;
        }

        console.error('Gagal membaca metadata dashboard:',error);
        // Error metadata tidak mengganggu data live, jadi tidak perlu
        // menampilkan pesan merah kepada pengguna.
      }
    }

    function formatWib(date=new Date()){
      try{
        return new Intl.DateTimeFormat('id-ID',{
          timeZone:'Asia/Jakarta',
          day:'2-digit',month:'2-digit',year:'numeric',
          hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false
        }).format(date).replace(/\./g,':')+' WIB';
      }catch{return date.toLocaleString('id-ID');}
    }

    function updateLastUpdateText(date=new Date()){
      if(els.lastUpdate)els.lastUpdate.textContent=formatWib(date);
    }

    function prettyDate(value){
      if(!value)return 'Pilih tanggal';
      const [year,month,day]=value.split('-');
      const names=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
      return `${day}-${names[Number(month)-1]}-${year}`;
    }

    function updateCounts(){
      const normal=allResults.filter(item=>!item.isHoki).length;
      const hoki=allResults.filter(item=>item.isHoki).length;
      els.totalCount.textContent=allResults.length;
      els.normalCount.textContent=normal;
      els.hokiCount.textContent=hoki;
      els.normalTabCount.textContent=normal;
      els.hokiTabCount.textContent=hoki;
    }

    function cardTemplate(item){
      const isCopied=item.id===copiedMarketId&&Date.now()<copiedUntil;
      const copyIcon=isCopied
        ? '<path d="m5 12 4 4L19 6"></path>'
        : '<rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>';

      return `
        <article class="card ${item.isMulti?'multi':''} ${isCopied?'copy-success':''}">
          <h2 class="card-title">${escapeHtml(item.market)}</h2>
          <div class="card-text">${(item.localizedLines||item.lines.map(localizeDateLanguage)).map(escapeHtml).join('\n')}</div>
          <button class="copy-btn ${isCopied?'copied':''}" type="button" data-copy-id="${escapeHtml(item.id)}">
            <svg class="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${copyIcon}</svg>
            <span class="copy-label">${isCopied?'TERSALIN':'SALIN'}</span>
          </button>
        </article>`;
    }

    function filteredResults(){
      const keyword=normalizeForSearch(els.search.value).toLowerCase();
      const selectedDate=els.dateFilter.value;
      let rows=allResults.filter(item=>activeTab==='hoki'?item.isHoki:!item.isHoki);
      if(keyword)rows=rows.filter(item=>item.searchText.includes(keyword));
      if(selectedDate)rows=rows.filter(item=>item.dateTokens.includes(selectedDate));
      if(activeSort==='newest'){
        // Default Terbaru mengikuti urutan resmi MARKET_RULES dari bawah ke atas.
        rows.sort((a,b)=>b.index-a.index);
      }else{
        // Tombol Lama mengikuti urutan resmi MARKET_RULES dari atas ke bawah.
        rows.sort((a,b)=>a.index-b.index);
      }
      return rows;
    }

    function renderResults({fresh=false}={}){
      updateCounts();
      if(!allResults.length){
        showState('Belum ada data lengkap','Pasaran baru tampil setelah seluruh Result wajibnya terisi. Nilai 0000 tetap dianggap sebagai data lengkap.');
        return;
      }
      const rows=filteredResults();
      if(!rows.length){
        showState('Data tidak ditemukan','Tidak ada data terisi pada pilihan pasaran, tanggal, atau pencarian tersebut.');
        return;
      }
      els.grid.innerHTML=rows.map(cardTemplate).join('');
      els.state.classList.add('hidden');
      els.grid.classList.remove('hidden');

      // Bila render ulang terjadi saat efek copy masih aktif,
      // terapkan kembali hanya pada satu tombol yang sedang disalin.
      if(copiedMarketId&&Date.now()<copiedUntil){
        applyCopyVisual(copiedMarketId);
      }else if(copiedMarketId){
        copiedMarketId='';
        copiedUntil=0;
        resetAllCopyVisuals();
      }
    }

    function dataSignature(rows){
      return JSON.stringify(rows.map(item=>item.lines));
    }

    function applySheetResults(parsed,{silent=false}={}){
      const trackedResults=applyMarketActivity(parsed);
      const nextSignature=dataSignature(trackedResults);
      const changed=nextSignature!==lastDataSignature;
      confirmedEmptyCycles=0;
      if(changed){
        allResults=trackedResults;
        lastDataSignature=nextSignature;
        updateLastUpdateText(new Date());
        renderResults({fresh:true});
        if(!silent)showToast(`Berhasil memuat ${allResults.length} pasaran dengan prize lengkap`);
      }else if(!allResults.length){
        allResults=trackedResults;
        updateLastUpdateText(new Date());
        renderResults();
      }
    }

    async function loadSheetData({silent=false}={}){
      if(isLoading)return;

      // Tanggal lama dan data hari ini yang sudah dikunci selalu dibaca dari database.
      if(!isViewingToday())return;
      if(dashboardMeta.todayLocked&&dashboardMeta.today){
        await loadStoredSnapshot(dashboardMeta.today,{silent:true});
        return;
      }

      currentDataMode='live';
      currentSnapshotDate='';
      isLoading=true;

      const attempts=[
        {gid:CONFIG.gid,range:CONFIG.range},
        {sheet:CONFIG.sheetName,range:CONFIG.range}
      ];
      let lastError=null;
      let emptyCandidate=null;

      try{
        for(const attempt of attempts){
          try{
            const parsed=parseResponse(await requestGoogleSheet(attempt));
            if(parsed.length){
              applySheetResults(parsed,{silent});
              return;
            }
            emptyCandidate=parsed;
            if(!allResults.length){
              applySheetResults(parsed,{silent});
              return;
            }
          }catch(error){
            lastError=error;
            console.warn('Jalur Google Sheets gagal:',error);
          }
        }

        if(emptyCandidate&&allResults.length){
          confirmedEmptyCycles+=1;
          if(confirmedEmptyCycles>=2&&dashboardMeta.today){
            const restored=await loadStoredSnapshot(dashboardMeta.today,{silent:true});
            if(!restored){
              allResults=[];
              lastDataSignature='[]';
              renderResults({fresh:true});
            }
          }
          return;
        }

        throw lastError||new Error('Google Sheets tidak memberikan respons.');
      }catch(error){
        console.error(error);
        if(!allResults.length){
          showState('Google Sheets tidak dapat diakses','Pastikan akses Google Sheet adalah: Siapa saja yang memiliki link dapat melihat.');
        }
        if(!silent)showToast(error?.message||'Koneksi Google Sheets gagal.','error');
      }finally{
        isLoading=false;
      }
    }

    async function copyText(text){
      try{
        if(navigator.clipboard&&window.isSecureContext){
          await navigator.clipboard.writeText(text);
          return true;
        }

        const area=document.createElement('textarea');
        area.value=text;
        area.setAttribute('readonly','');
        area.style.position='fixed';
        area.style.left='-9999px';
        area.style.opacity='0';
        document.body.appendChild(area);
        area.select();
        area.setSelectionRange(0,area.value.length);
        const success=document.execCommand('copy');
        area.remove();

        if(!success)throw new Error('Perintah salin ditolak browser.');
        return true;
      }catch(error){
        console.error('Gagal menyalin:',error);
        return false;
      }
    }

        }
      });

    function showCopySuccess(button,item){
      clearTimeout(copiedResetTimer);

      // Bersihkan efek tombol sebelumnya terlebih dahulu. Versi lama
      // menghentikan timer lama tanpa menghapus warna hijau tombol lama,
      // sehingga beberapa tombol dapat tertinggal hijau.
      resetAllCopyVisuals();

      copiedEffectVersion+=1;
      const effectVersion=copiedEffectVersion;

      copiedMarketId=item.id;
      copiedUntil=Date.now()+1500;

      applyCopyVisual(item.id);
      showToast(`Hasil ${item.market} berhasil disalin`);

      copiedResetTimer=setTimeout(()=>{
        if(effectVersion!==copiedEffectVersion)return;

        copiedMarketId='';
        copiedUntil=0;
        resetAllCopyVisuals();
      },1500);
    }

    els.grid.addEventListener('click',async event=>{
      const button=event.target.closest('[data-copy-id]');
      if(!button||button.dataset.copying==='true')return;

      const item=allResults.find(row=>row.id===button.dataset.copyId);
      if(!item)return;

      button.dataset.copying='true';

      const copiedLines=item.localizedLines||item.lines.map(localizeDateLanguage);
      const success=await copyText(copiedLines.join('\n'));

      // Tombol dapat terganti ketika data realtime dirender ulang,
      // jadi status proses dibersihkan pada elemen lama maupun elemen terbaru.
      delete button.dataset.copying;
      const latestButton=findCopyButtonById(item.id);
      if(latestButton)delete latestButton.dataset.copying;

      if(success){
        showCopySuccess(latestButton||button,item);
      }else{
        resetAllCopyVisuals();
        showToast('Data gagal disalin. Izinkan akses clipboard browser.','error');
      }
    });

    els.tabs.forEach(tab=>tab.addEventListener('click',()=>{
      activeTab=tab.dataset.tab;
      els.tabs.forEach(item=>item.classList.toggle('active',item===tab));
      renderResults();
    }));

    els.search.addEventListener('input',renderResults);

    els.refresh.addEventListener('click',async()=>{
      updateLastUpdateText(new Date());
      await loadDashboardMeta({silent:true});
      await loadWallpaperDirectFromSheet();

      if(!isViewingToday()){
        await loadStoredSnapshot(selectedDateKey(),{silent:false});
        return;
      }

      if(dashboardMeta.todayLocked&&dashboardMeta.today){
        await loadStoredSnapshot(dashboardMeta.today,{silent:false});
        return;
      }

      await loadSheetData({silent:false});
    });

    els.datePickerButton.addEventListener('click',event=>{
      event.preventDefault();
      event.stopPropagation();
      toggleDateMenu();
    });

    els.dateMenu.addEventListener('click',async event=>{
      const option=event.target.closest('[data-date-value]');
      if(!option)return;
      await selectDashboardDate(option.dataset.dateValue,{silent:false});
    });

    document.addEventListener('click',event=>{
      if(!els.datePicker.contains(event.target))closeDateMenu();
    });

    document.addEventListener('keydown',event=>{
      if(event.key==='Escape')closeDateMenu();
    });

    els.todayBtn.addEventListener('click',async()=>{
      const today=resetDateSelectionToToday();
      clearDisplayedResults();

      if(dashboardMeta.todayLocked){
        const found=await loadStoredSnapshot(today,{silent:true});
        if(!found)showNoResultForDate(today);
      }else{
        await loadSheetData({silent:true});
        if(!allResults.length)showNoResultForDate(today);
      }
    });
    els.newest.addEventListener('click',()=>{
      activeSort='newest';
      els.newest.classList.add('active');
      els.oldest.classList.remove('active');
      renderResults();
    });
    els.oldest.addEventListener('click',()=>{
      activeSort='oldest';
      els.oldest.classList.add('active');
      els.newest.classList.remove('active');
      renderResults();
    });

    window.addEventListener('pageshow',event=>{
      if(!event.persisted)return;

      const today=resetDateSelectionToToday();
      clearDisplayedResults();

      if(dashboardMeta.todayLocked){
        loadStoredSnapshot(today,{silent:true}).then(found=>{
          if(!found)showNoResultForDate(today);
        });
      }else{
        loadSheetData({silent:true}).then(()=>{
          if(!allResults.length)showNoResultForDate(today);
        });
      }
    });

    document.addEventListener('visibilitychange',()=>{
      if(document.hidden)return;
      if(isGoogleWebApp())loadDashboardMeta({silent:true});
      loadWallpaperDirectFromSheet();
      if(isViewingToday()&&!dashboardMeta.todayLocked){
        loadSheetData({silent:true});
      }
    });

    updateLastUpdateText(new Date());
    setInterval(()=>updateLastUpdateText(new Date()),1000);

    async function initializeDashboard(){
      // Browser kadang memulihkan nilai input sebelum F5.
      // Nilai tersebut selalu dikosongkan dan dashboard kembali ke hari ini.
      els.dateFilter.value='';
      const fallbackToday=getWibTodayKey();
      setSelectedDateDisplay(fallbackToday);
      currentDataMode='live';
      currentSnapshotDate='';

      if(isGoogleWebApp()){
        await loadDashboardMeta({silent:true});
      }

      const today=dashboardMeta.today||fallbackToday;
      setSelectedDateDisplay(today);

      if(dashboardMeta.todayLocked){
        const found=await loadStoredSnapshot(today,{silent:true});
        if(!found)showNoResultForDate(today);
      }else{
        await loadSheetData({silent:true});
        if(!allResults.length)showNoResultForDate(today);
      }

      await loadWallpaperDirectFromSheet();
    }

    initializeDashboard();

    // Baca Background!A2 langsung dari Google Sheet publik.
    // Ini membuat wallpaper tetap update walaupun metadata server terlambat.
    wallpaperPollTimer=setInterval(()=>{
      if(!document.hidden)loadWallpaperDirectFromSheet();
    },5000);

    if(isGoogleWebApp()){
      archiveMetaTimer=setInterval(()=>{
        if(!document.hidden)loadDashboardMeta({silent:true});
      },ARCHIVE_CONFIG.metaRefreshMs);
    }

    refreshTimer=setInterval(()=>{
      if(!document.hidden&&isViewingToday()&&!dashboardMeta.todayLocked){
        loadSheetData({silent:true});
      }
    },CONFIG.refreshMs);
  </script>

<script>
/**
* Simple keyboard shortcut handler
*/
const shortcut = {
  all_shortcuts: {},
  add: function(combo, callback, options) {
    const defaultOpts = {
      type: "keydown",
      propagate: false,
      disable_in_input: false,
      target: document,
      keycode: false
    };
    const settings = Object.assign({}, defaultOpts, options || {});
    const target = typeof settings.target === "string"
      ? document.getElementById(settings.target)
      : settings.target;

    combo = combo.toLowerCase();

    const handler = function(e) {
      e = e || window.event;

      // Skip if inside input/textarea and disable_in_input = true
      if (settings.disable_in_input) {
        let element = e.target || e.srcElement;
        if (element.nodeType === 3) element = element.parentNode;
        if (element.tagName === "INPUT" || element.tagName === "TEXTAREA") return;
      }

      const code = e.keyCode || e.which;
      let key = String.fromCharCode(code).toLowerCase();
      if (code === 188) key = ",";
      if (code === 190) key = ".";

      const keys = combo.split("+");
      let matchCount = 0;

      const specialKeys = {
        esc:27, escape:27, tab:9, space:32, return:13, enter:13,
        backspace:8, left:37, up:38, right:39, down:40,
        f1:112,f2:113,f3:114,f4:115,f5:116,f6:117,
        f7:118,f8:119,f9:120,f10:121,f11:122,f12:123
      };

      let ctrlReq=false, shiftReq=false, altReq=false, metaReq=false;
      let ctrl=e.ctrlKey, shift=e.shiftKey, alt=e.altKey, meta=e.metaKey;

      for (let i=0; i<keys.length; i++) {
        const k = keys[i];
        if (k === "ctrl" || k === "control") { ctrlReq = true; matchCount++; }
        else if (k === "shift") { shiftReq = true; matchCount++; }
        else if (k === "alt") { altReq = true; matchCount++; }
        else if (k === "meta") { metaReq = true; matchCount++; }
        else if (k.length > 1) { if (specialKeys[k] === code) matchCount++; }
        else if (settings.keycode ? settings.keycode === code : key === k) { matchCount++; }
      }

      if (
        matchCount === keys.length &&
        ctrl === ctrlReq && shift === shiftReq &&
        alt === altReq && meta === metaReq
      ) {
        callback(e);
        if (!settings.propagate) {
          e.cancelBubble = true;
          e.returnValue = false;
          if (e.stopPropagation) e.stopPropagation();
          if (e.preventDefault) e.preventDefault();
          return false;
        }
      }
    };

    this.all_shortcuts[combo] = { callback: handler, target, event: settings.type };
    target.addEventListener(settings.type, handler, false);
  }
};

// Fungsi kosong yang tidak melakukan apa-apa
function doNothing(e) {
  console.log("Shortcut diblokir: " + (e.key || e.keyCode));
}

// Fungsi untuk mengatur shortcut
function setupShortcuts() {
  shortcut.add("Ctrl+U", doNothing);
  shortcut.add("f12", doNothing);
  shortcut.add("Ctrl+Shift+I", doNothing);
  shortcut.add("Ctrl+Shift+J", doNothing);
  shortcut.add("Ctrl+Shift+C", doNothing);
}

// Setup shortcut saat pertama kali
setupShortcuts();

// Event listener untuk mencegah semua aksi default shortcut developer
document.addEventListener('keydown', function(e) {
  // F12 - Developer Tools
  if (e.keyCode === 123) {
    e.preventDefault();
    e.stopPropagation();
    return false;
  }

  // Ctrl+Shift+I - Developer Tools
  if (e.ctrlKey && e.shiftKey && e.keyCode === 73) {
    e.preventDefault();
    e.stopPropagation();
    return false;
  }

  // Ctrl+Shift+J - JavaScript Console
  if (e.ctrlKey && e.shiftKey && e.keyCode === 74) {
    e.preventDefault();
    e.stopPropagation();
    return false;
  }

  // Ctrl+Shift+C - Inspect Element
  if (e.ctrlKey && e.shiftKey && e.keyCode === 67) {
    e.preventDefault();
    e.stopPropagation();
    return false;
  }

  // Ctrl+U - View Source
  if (e.ctrlKey && e.keyCode === 85) {
    e.preventDefault();
    e.stopPropagation();
    return false;
  }

  // Ctrl+S - Save Page
  if (e.ctrlKey && e.keyCode === 83) {
    e.preventDefault();
    e.stopPropagation();
    return false;
  }
});

// Mencegah klik kanan
document.addEventListener('contextmenu', function(e) {
  e.preventDefault();
  return false;
});

// Mencegah drag & drop
document.addEventListener('dragstart', function(e) {
  e.preventDefault();
  return false;
});

// Mencegah seleksi teks
document.addEventListener('selectstart', function(e) {
  // Tetap izinkan interaksi pada kolom pencarian dan elemen form.
  if (e.target.closest('input, textarea, select')) return;
  e.preventDefault();
  return false;
});
</script>
